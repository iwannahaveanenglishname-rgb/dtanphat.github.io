            cards: [

            ]

        // FISHER-YATES SHUFFLE
        function fisherYatesShuffle(array) {
            if (!Array.isArray(array)) return [];
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        const getTodayString = () => new Date().toISOString().split('T')[0];
        const getCardWord = (card) => { if (!card) return ''; return (card.english || card.word || card.german || '').trim(); };
        const getCardMeaning = (card) => { if (!card) return ''; return (card.vietnamese || card.meaning || card.german || '').trim(); };

        const getPosAbbreviation = (pos) => {
            if (!pos) return '';
            const cleanPos = pos.trim().toLowerCase();
            const posMap = {
                'noun': 'n.',
                'verb': 'v.',
                'adjective': 'adj.',
                'adverb': 'adv.',
                'preposition': 'prep.',
                'conjunction': 'conj.',
                'pronoun': 'pron.',
                'interjection': 'interj.',
                'phrase': 'phr.',
                'phrasal verb': 'phr. v.'
            };
            return posMap[cleanPos] || (cleanPos.endsWith('.') ? cleanPos : cleanPos);
        };

        // AMERICAN ENGLISH TTS SYSTEM
        const getAmericanEnglishVoice = () => {
            if (!window.speechSynthesis) return null;
            const voices = window.speechSynthesis.getVoices();
            if (!voices || voices.length === 0) return null;

            const usVoices = voices.filter(v => {
                const lang = (v.lang || '').replace('_', '-').toLowerCase();
                return lang === 'en-us';
            });

            if (usVoices.length > 0) {
                const priorityKeywords = [
                    'natural', 'google us english', 'google', 'online', 'premium',
                    'samantha', 'alex', 'jenny', 'guy', 'aria', 'christopher', 'zira', 'david', 'ava', 'allison'
                ];
                for (const kw of priorityKeywords) {
                    const found = usVoices.find(v => v.name.toLowerCase().includes(kw));
                    if (found) return found;
                }
                return usVoices.find(v => !v.localService) || usVoices[0];
            }

            const otherEnglishVoices = voices.filter(v => (v.lang || '').toLowerCase().startsWith('en'));
            if (otherEnglishVoices.length > 0) {
                const nonUsLocales = ['en-gb', 'en-au', 'en-in', 'en-ie', 'en-za', 'en-nz', 'en-ca'];
                const nonGbFiltered = otherEnglishVoices.filter(v => {
                    const lang = (v.lang || '').replace('_', '-').toLowerCase();
                    return !nonUsLocales.includes(lang);
                });
                if (nonGbFiltered.length > 0) return nonGbFiltered[0];
                return otherEnglishVoices[0];
            }
            return null;
        };

        if (typeof window !== 'undefined' && window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => { getAmericanEnglishVoice(); };
        }

        const playAudio = (text) => {
            if (!text || !window.speechSynthesis) return;
            try {
                window.speechSynthesis.cancel(); 
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US';
                u.rate = 0.95;
                const americanVoice = getAmericanEnglishVoice();
                if (americanVoice) u.voice = americanVoice;
                window.speechSynthesis.speak(u);
            } catch (err) {
                console.error('TTS playback error:', err);
            }
        };

        function useLongPress(onLongPress, onClick, { delay = 600 } = {}) {
            const timerRef = useRef(null);
            const isLongPressRef = useRef(false);

            const start = useCallback((e) => {
                if (e.type === 'mousedown' && e.button !== 0) return;
                isLongPressRef.current = false;
                timerRef.current = setTimeout(() => {
                    isLongPressRef.current = true;
                    if (window.navigator && window.navigator.vibrate) try { window.navigator.vibrate(50); } catch (err) {}
                    onLongPress(e);
                }, delay);
            }, [onLongPress, delay]);

            const stop = useCallback(() => {
                if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
            }, []);

            const handleClick = useCallback((e) => {
                if (isLongPressRef.current) { e.stopPropagation(); e.preventDefault(); isLongPressRef.current = false; return; }
                if (onClick) onClick(e);
            }, [onClick]);

            return { onMouseDown: start, onMouseUp: stop, onMouseLeave: stop, onTouchStart: start, onTouchEnd: stop, onTouchMove: stop, onClick: handleClick };
        }

        const callGeminiAPI = async (prompt, systemInstruction = "", responseSchema = null, customApiKey = "") => {
            const apiKey = (customApiKey || '').trim();
            if (!apiKey) throw new Error("Gemini API key is missing. Please set your API key in Settings.");
            
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            if (responseSchema) payload.generationConfig = { responseMimeType: "application/json", responseSchema: responseSchema };
            
            try {
                const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!res.ok) {
                    let errorMsg = `HTTP Error ${res.status}`;
                    try {
                        const errData = await res.json();
                        if (errData?.error?.message) errorMsg = errData.error.message;
                    } catch (e) {
                        try { errorMsg = await res.text(); } catch (tErr) { errorMsg = `Status ${res.status}`; }
                    }
                    throw new Error(`API Error [${res.status}]: ${errorMsg}`);
                }
                const data = await res.json();
                const candidate = data.candidates && data.candidates[0];
                const parts = candidate && candidate.content && candidate.content.parts;
                if (!parts || parts.length === 0) throw new Error("Invalid response format received from Gemini AI.");
                const textPart = parts.find(p => p.text && !p.thought) || parts.find(p => p.text) || parts[0];
                if (!textPart || typeof textPart.text !== 'string') throw new Error("No text content found in AI API response.");
                return textPart.text;
            } catch (err) {
                if (err.message && (err.message.includes('Failed to fetch') || err.message.includes('NetworkError'))) {
                    throw new Error("Network Error: Unable to connect to Gemini AI API.");
                }
                throw err;
            }
        };

        };

        const SetGridCard = ({ setItem, cardsCount, onSelect, onEdit, onLongPressDelete }) => {
            const pressHandlers = useLongPress(onLongPressDelete, onSelect);
            return (
                <div {...pressHandlers} className="group bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-2xl p-5 cursor-pointer transition-all transform hover:-translate-y-1 hover:shadow-xl overflow-hidden flex flex-col">
                    <div className="flex justify-between items-start mb-2">
                        <div className="flex items-center gap-2 text-emerald-400 text-xs font-bold uppercase tracking-wider mb-2"><Icons.Book /> Study Set / Unit</div>
                        <button onClick={onEdit} className="p-1.5 text-slate-400 hover:text-white hover:bg-slate-600 rounded-lg transition-colors"><Icons.Edit /></button>
                    </div>
                    <h4 className="font-bold text-lg text-white mb-1 line-clamp-2 flex-1">{setItem.title}</h4>
                    {setItem.description && <p className="text-sm text-slate-400 line-clamp-1 mb-4">{setItem.description}</p>}
                    <div className="flex items-center justify-between mt-auto pt-3 border-t border-slate-700">
                        <span className="text-xs text-slate-400 font-medium bg-slate-900 px-2.5 py-1 rounded-md">{cardsCount} Cards</span>
                        <span className="text-xs text-slate-500">{setItem.createdAt}</span>
                    </div>
                </div>
            );
        };

        const FlashcardListItem = ({ card, onEdit, onToggleLearned, onLongPressDelete }) => {
            const pressHandlers = useLongPress(onLongPressDelete, onEdit);
            const word = getCardWord(card);
            const partOfSpeech = card.partOfSpeech || card.article || '';
            const posAbbr = getPosAbbreviation(partOfSpeech);
            const ipa = card.ipa || (card.plural && card.plural.startsWith('/') ? card.plural : '');
            const vietnamese = getCardMeaning(card);

            return (
                <div {...pressHandlers} className={`group flex flex-col p-4 rounded-xl border transition-all cursor-pointer ${card.isLearned ? 'bg-slate-900/50 border-slate-800 opacity-60' : 'bg-slate-800 hover:bg-slate-700 border-slate-700 hover:border-slate-500'}`}>
                    <div className="flex items-center justify-between">
                        <div className="flex items-center gap-4 flex-1 overflow-hidden">
                            <button onClick={(e) => { e.stopPropagation(); onToggleLearned(card); }} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-colors ${card.isLearned ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-500 text-transparent hover:border-emerald-500'}`}><Icons.Check /></button>
                            <div className="flex-1 min-w-0 grid grid-cols-1 md:grid-cols-2 gap-2 md:gap-4">
                                <div className="truncate">
                                    <span className="font-bold text-lg text-white truncate">{word}</span>
                                    {posAbbr && <span className="text-xs text-amber-400 font-mono ml-2 font-medium">({posAbbr})</span>}
                                    {ipa && <span className="text-xs text-slate-400 font-mono ml-2">{ipa}</span>}
                                    {card.example && <p className="text-xs text-slate-300 truncate mt-0.5 italic">"{card.example}"</p>}
                                </div>
                                <div className="truncate flex items-center text-slate-300"><span className="truncate font-semibold text-emerald-400">{vietnamese}</span></div>
                            </div>
                        </div>
                        <div className="flex items-center ml-4 gap-1">
                            <button onClick={(e) => { e.stopPropagation(); onEdit(e); }} className="p-2 text-slate-400 hover:text-white rounded-lg"><Icons.Edit /></button>
                        </div>
                    </div>
                    <div className="flex items-center gap-2 mt-3 pt-3 border-t border-slate-700/50">
                        <button onClick={(e) => { e.stopPropagation(); playAudio(word); }} className="flex items-center gap-1 text-xs px-2.5 py-1 bg-slate-900 rounded-md text-amber-400 hover:bg-amber-500/20 transition-colors"><Icons.Speaker /> English</button>
                        {card.example && <button onClick={(e) => { e.stopPropagation(); playAudio(card.example); }} className="flex items-center gap-1 text-xs px-2.5 py-1 bg-slate-900 rounded-md text-slate-400 hover:text-white transition-colors"><Icons.Speaker /> Example Sentence</button>}
                    </div>
                </div>
            );
        };

        function App() {
            const [folders, setFolders] = useState([]);
            const [sets, setSets] = useState([]);
            const [cards, setCards] = useState([]);
            const [userApiKey, setUserApiKey] = useState('');
            const [isApiKeyModalOpen, setIsApiKeyModalOpen] = useState(false);
            const [currentView, setCurrentView] = useState('dashboard');
            const [activeFolderId, setActiveFolderId] = useState(null);
            const [activeSetId, setActiveSetId] = useState(null);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            
            // Flashcard Language Direction state
            const [flashcardDirection, setFlashcardDirection] = useState(() => {
                return localStorage.getItem(FLASHCARD_DIRECTION_KEY) || 'de-en';
            });

            const toggleFlashcardDirection = () => {
                const nextDir = flashcardDirection === 'de-en' ? 'en-de' : 'de-en';
                setFlashcardDirection(nextDir);
                localStorage.setItem(FLASHCARD_DIRECTION_KEY, nextDir);
            };

            const [isFolderModalOpen, setIsFolderModalOpen] = useState(false);
            const [editingFolder, setEditingFolder] = useState(null);
            const [folderForm, setFolderForm] = useState({ name: '', description: '' });
            
            const [isSetModalOpen, setIsSetModalOpen] = useState(false);
            const [editingSet, setEditingSet] = useState(null);
            const [setForm, setSetForm] = useState({ title: '', description: '', folderId: '' });
            
            const [isCardModalOpen, setIsCardModalOpen] = useState(false);
            const [editingCard, setEditingCard] = useState(null);
            const [cardForm, setCardForm] = useState({ english: '', vietnamese: '', example: '', exampleTranslation: '', imageUrl: '', plural: '', partOfSpeech: 'noun', ipa: '' });
            
            // Quick AI Import States
            const [isAiImportModalOpen, setIsAiImportModalOpen] = useState(false);
            const [importRawText, setImportRawText] = useState('');
            const [customPromptNote, setCustomPromptNote] = useState('');
            const [isAiImporting, setIsAiImporting] = useState(false);
            const [targetImportSetId, setTargetImportSetId] = useState('');
            const [aiPreviewCards, setAiPreviewCards] = useState([]);
            const [aiImportError, setAiImportError] = useState(null);

            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, message: '', onConfirm: null });
            const [toastMessage, setToastMessage] = useState(null);
            const [studySession, setStudySession] = useState({ cards: [], currentIndex: 0, isFlipped: false, showResult: false });
            
            // UNIT EXERCISE SYSTEM STATES
            const [isUnitExerciseModalOpen, setIsUnitExerciseModalOpen] = useState(false);
            const [exerciseConfig, setExerciseConfig] = useState({
                exerciseType: 'all', // 'meaning_to_word', 'complete_sentence', 'make_sentence', 'all'
                answerFormat: 'written', // 'multiple_choice', 'written', 'mixed'
                questionCount: 10
            });

            const [unitQuizState, setUnitQuizState] = useState({
                questions: [],
                currentIndex: 0,
                userAnswers: {},
                aiEvaluations: {}, // qId -> { correct, score, userAnswer, correctAnswer, correction, explanation, feedback }
                isSubmitted: false,
                isLoadingAI: false,
                isEvaluating: false,
                overallFeedback: null
            });

            const [writtenAnswerInput, setWrittenAnswerInput] = useState('');
            const writtenInputRef = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                loadLocalData();
                const key = localStorage.getItem(API_KEY_STORAGE_KEY) || localStorage.getItem(OLD_API_KEY_STORAGE_KEY);
                if (key) setUserApiKey(key);
            }, []);

            useEffect(() => { localStorage.setItem(VIEW_STATE_STORAGE_KEY, currentView); }, [currentView]);

            useEffect(() => {
                if (currentView === 'unit_quiz_play' && writtenInputRef.current) {
                    const timer = setTimeout(() => { if (writtenInputRef.current) writtenInputRef.current.focus(); }, 100);
                    return () => clearTimeout(timer);
                }
            }, [currentView, unitQuizState.currentIndex, unitQuizState.isEvaluating]);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(null), 3500); };

            const loadLocalData = () => {
                try {
                    let saved = localStorage.getItem(LOCAL_STORAGE_KEY) || localStorage.getItem(OLD_LOCAL_STORAGE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        const loadedCards = (parsed.cards || []).map(c => ({ ...c, english: getCardWord(c) }));
                        setFolders(parsed.folders || defaultSampleData.folders);
                        setSets(parsed.sets || defaultSampleData.sets);
                        setCards(loadedCards.length > 0 ? loadedCards : defaultSampleData.cards);
                    } else {
                        setFolders(defaultSampleData.folders); setSets(defaultSampleData.sets); setCards(defaultSampleData.cards);
                        saveToLocalStorage(defaultSampleData.folders, defaultSampleData.sets, defaultSampleData.cards);
                    }
                    const savedView = localStorage.getItem(VIEW_STATE_STORAGE_KEY);
                    if (savedView && savedView !== 'exercise_hub' && savedView !== 'quiz_play') setCurrentView(savedView);
                } catch (e) { setFolders(defaultSampleData.folders); setSets(defaultSampleData.sets); setCards(defaultSampleData.cards); }
            };

            const saveToLocalStorage = (newFolders, newSets, newCards) => localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({ folders: newFolders, sets: newSets, cards: newCards }));

            const saveApiKey = (keyStr) => { setUserApiKey(keyStr); localStorage.setItem(API_KEY_STORAGE_KEY, keyStr); showToast("Gemini API Key saved!"); setIsApiKeyModalOpen(false); };

            const exportDataJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ folders, sets, cards, exportDate: new Date().toISOString() }, null, 2));
                const downloadAnchor = document.createElement('a'); downloadAnchor.setAttribute("href", dataStr); downloadAnchor.setAttribute("download", `English_AI_Backup_${getTodayString()}.json`);
                document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove(); showToast("Backup downloaded successfully!");
            };

            const handleImportJSON = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.folders && imported.sets && imported.cards) {
                            const formattedCards = imported.cards.map(c => ({ ...c, english: getCardWord(c) }));
                            setFolders(imported.folders); setSets(imported.sets); setCards(formattedCards); saveToLocalStorage(imported.folders, imported.sets, formattedCards); showToast("Data imported successfully!");
                        } else alert("Invalid JSON backup structure!");
                    } catch (err) { alert("Cannot read this JSON file!"); }
                };
                reader.readAsText(file);
            };

            const handleSaveFolder = async (e) => {
                if (e) e.preventDefault(); if (!folderForm.name.trim()) return;
                const folderId = editingFolder ? editingFolder.id : 'folder_' + Date.now();
                const data = { id: folderId, name: folderForm.name.trim(), description: folderForm.description.trim(), createdAt: editingFolder ? editingFolder.createdAt : getTodayString(), inTrash: editingFolder ? editingFolder.inTrash : false };
                const updated = editingFolder ? folders.map(f => f.id === folderId ? data : f) : [...folders, data];
                setFolders(updated); saveToLocalStorage(updated, sets, cards); showToast(editingFolder ? "Folder updated!" : "New folder created!"); setIsFolderModalOpen(false);
                if (!editingFolder) { setActiveFolderId(folderId); setCurrentView('folder'); }
            };

            const handleSoftDeleteFolder = (folderId) => {
                const updated = folders.map(f => f.id === folderId ? { ...f, inTrash: true } : f); setFolders(updated); saveToLocalStorage(updated, sets, cards); showToast("Folder moved to trash!");
                if (activeFolderId === folderId) { setCurrentView('dashboard'); setActiveFolderId(null); } setConfirmDialog({ isOpen: false, message: '', onConfirm: null });
            };
            const handleLongPressDeleteFolder = (folder) => setConfirmDialog({ isOpen: true, message: `Move folder "${folder.name}" to trash?`, onConfirm: () => handleSoftDeleteFolder(folder.id) });

            const handleSaveSet = async (e) => {
                if(e) e.preventDefault(); if (!setForm.title.trim()) return;
                const targetFolderId = setForm.folderId || activeFolderId || ''; const setId = editingSet ? editingSet.id : 'set_' + Date.now();
                const data = { id: setId, title: setForm.title.trim(), description: setForm.description.trim(), folderId: targetFolderId, createdAt: editingSet ? editingSet.createdAt : getTodayString(), inTrash: editingSet ? editingSet.inTrash : false };
                const updated = editingSet ? sets.map(s => s.id === setId ? data : s) : [...sets, data];
                setSets(updated); saveToLocalStorage(folders, updated, cards); showToast(editingSet ? "Set updated!" : "New set created!"); setIsSetModalOpen(false);
                if (!editingSet) { setActiveSetId(setId); setCurrentView('set'); }
            };

            const handleSoftDeleteSet = (setId) => {
                const updated = sets.map(s => s.id === setId ? { ...s, inTrash: true } : s); setSets(updated); saveToLocalStorage(folders, updated, cards); showToast("Set moved to trash!");
                if (activeSetId === setId) { setCurrentView(activeFolderId ? 'folder' : 'dashboard'); setActiveSetId(null); } setConfirmDialog({ isOpen: false, message: '', onConfirm: null });
            };
            const handleLongPressDeleteSet = (setItem) => setConfirmDialog({ isOpen: true, message: `Move set "${setItem.title}" to trash?`, onConfirm: () => handleSoftDeleteSet(setItem.id) });

            const handleSaveCard = async (e) => {
                if(e) e.preventDefault(); const word = cardForm.english.trim(); const meaning = cardForm.vietnamese.trim(); if (!word || !meaning) return; if (!activeSetId) return;
                const cardId = editingCard ? editingCard.id : 'card_' + Date.now();
                const data = {
                    id: cardId,
                    setId: activeSetId,
                    english: word,
                    word: word,
                    german: word,
                    article: cardForm.partOfSpeech || 'noun',
                    partOfSpeech: cardForm.partOfSpeech || 'noun',
                    ipa: cardForm.ipa || cardForm.plural || '',
                    plural: cardForm.ipa || cardForm.plural || '',
                    vietnamese: meaning,
                    meaning: meaning,
                    example: cardForm.example.trim(),
                    exampleTranslation: cardForm.exampleTranslation?.trim() || '',
                    imageUrl: cardForm.imageUrl.trim(),
                    createdAt: editingCard ? editingCard.createdAt : getTodayString(),
                    isLearned: editingCard ? editingCard.isLearned : false,
                    inTrash: editingCard ? editingCard.inTrash : false
                };
                const updated = editingCard ? cards.map(c => c.id === cardId ? data : c) : [...cards, data];
                setCards(updated); saveToLocalStorage(folders, sets, updated); showToast(editingCard ? "Card updated!" : "New card created!"); setIsCardModalOpen(false);
            };

            const handleSoftDeleteCard = (cardId) => {
                const updated = cards.map(c => c.id === cardId ? { ...c, inTrash: true } : c); setCards(updated); saveToLocalStorage(folders, sets, updated); showToast("Card moved to trash!"); setConfirmDialog({ isOpen: false, message: '', onConfirm: null });
            };
            const handleLongPressDeleteCard = (card) => setConfirmDialog({ isOpen: true, message: `Delete card "${getCardWord(card)}"?`, onConfirm: () => handleSoftDeleteCard(card.id) });
            const toggleCardLearned = (card) => {
                const updated = cards.map(c => c.id === card.id ? { ...c, isLearned: !card.isLearned } : c); setCards(updated); saveToLocalStorage(folders, sets, updated);
            };

            // QUICK AI IMPORT FEATURE
            const openQuickAiImportModal = (defaultSetId = null) => {
                const targetId = defaultSetId || activeSetId || (activeSets.length > 0 ? activeSets[0].id : '');
                setTargetImportSetId(targetId);
                setImportRawText('');
                setCustomPromptNote('');
                setAiPreviewCards([]);
                setAiImportError(null);
                setIsAiImportModalOpen(true);
            };

            const handleRunAiImport = async () => {
                if (!userApiKey) {
                    showToast("Vui lòng nhập Gemini API Key để dùng AI Import!");
                    setIsApiKeyModalOpen(true);
                    return;
                }

                const cleanWords = Array.from(new Set(
                    importRawText
                        .split(/[\n,]+/)
                        .map(w => w.trim())
                        .filter(w => w.length > 0)
                ));

                if (cleanWords.length === 0) {
                    alert("Vui lòng nhập/dán ít nhất một từ tiếng Anh!");
                    return;
                }

                setIsAiImporting(true);
                setAiImportError(null);
                setAiPreviewCards([]);

                const prompt = `Generate English flashcard vocabulary data for the following ${cleanWords.length} words:\n${cleanWords.join('\n')}\n` +
                    (customPromptNote ? `Additional note/context from user: ${customPromptNote}\n` : '') +
                    `Requirements:
1. Use American English (US English) by default for vocabulary, spelling, meaning, and examples.
2. Return a JSON array containing an object for each requested word.
3. "word": Exact English word provided in input, but if there is a clear US spelling difference (e.g., colour vs color), provide the US spelling ("color").
4. "partOfSpeech": Part of speech (e.g. "noun", "verb", "adjective", "adverb", "preposition", "phrase", "phrasal verb"). Pick the most common usage in American English.
5. "ipa": Standard General American IPA pronunciation.
6. "meaning": Clear, accurate Vietnamese meaning corresponding to the common usage.
7. "example": Natural conversational American English example sentence demonstrating the word in context.`;

                const responseSchema = {
                    type: "ARRAY",
                    items: {
                        type: "OBJECT",
                        properties: {
                            word: { type: "STRING" },
                            partOfSpeech: { type: "STRING" },
                            ipa: { type: "STRING" },
                            meaning: { type: "STRING" },
                            example: { type: "STRING" }
                        },
                        required: ["word", "partOfSpeech", "ipa", "meaning", "example"]
                    }
                };

                try {
                    const responseText = await callGeminiAPI(
                        prompt,
                        "You are an expert English lexicographer and flashcard generator specializing in American English. Always generate accurate JSON matching the schema.",
                        responseSchema,
                        userApiKey
                    );

                    let parsedData = JSON.parse(responseText);
                    const validCards = parsedData.filter(item => item && item.word && item.meaning).map(item => ({
                        word: String(item.word).trim(),
                        partOfSpeech: String(item.partOfSpeech || 'noun').trim(),
                        ipa: String(item.ipa || '').trim(),
                        meaning: String(item.meaning).trim(),
                        example: String(item.example || '').trim()
                    }));

                    if (validCards.length === 0) throw new Error("No valid vocabulary data generated.");
                    setAiPreviewCards(validCards);
                } catch (err) {
                    setAiImportError(err.message || "Error processing AI Import.");
                } finally {
                    setIsAiImporting(false);
                }
            };

            const handleSaveAiImportedCards = () => {
                const destSetId = targetImportSetId || activeSetId;
                if (!destSetId) { alert("Vui lòng chọn Học phần / Unit!"); return; }
                if (aiPreviewCards.length === 0) return;

                const newCardObjects = aiPreviewCards.map((item, idx) => ({
                    id: 'card_ai_' + Date.now() + '_' + idx,
                    setId: destSetId,
                    english: item.word,
                    word: item.word,
                    german: item.word,
                    article: item.partOfSpeech,
                    partOfSpeech: item.partOfSpeech,
                    ipa: item.ipa,
                    plural: item.ipa,
                    vietnamese: item.meaning,
                    meaning: item.meaning,
                    example: item.example,
                    exampleTranslation: '',
                    imageUrl: '',
                    createdAt: getTodayString(),
                    isLearned: false,
                    inTrash: false
                }));

                const updatedCards = [...cards, ...newCardObjects];
                setCards(updatedCards);
                saveToLocalStorage(folders, sets, updatedCards);

                showToast(`Đã thêm ${newCardObjects.length} Flashcard vào Unit!`);
                setIsAiImportModalOpen(false);
                setActiveSetId(destSetId);
                if (currentView !== 'set') setCurrentView('set');
            };

            // FLASHCARD STUDY SESSION
            const startStudy = () => {
                if (!activeSetId) return;
                const setCardsList = activeCards.filter(c => c.setId === activeSetId);
                if (setCardsList.length === 0) { showToast("Học phần này chưa có thẻ từ vựng!"); return; }
                let unlearnedCards = setCardsList.filter(c => !c.isLearned);
                let cardsToStudy = unlearnedCards.length > 0 ? unlearnedCards : setCardsList;
                setStudySession({ cards: fisherYatesShuffle(cardsToStudy), currentIndex: 0, isFlipped: false, showResult: false });
                setCurrentView('study');
            };

            const nextStudyCard = (markAsLearned) => {
                const currentCard = studySession.cards[studySession.currentIndex];
                if (markAsLearned && !currentCard.isLearned) toggleCardLearned(currentCard);
                if (studySession.currentIndex + 1 < studySession.cards.length) setStudySession(prev => ({ ...prev, currentIndex: prev.currentIndex + 1, isFlipped: false }));
                else setStudySession(prev => ({ ...prev, showResult: true }));
            };

            // ==========================================
            // UNIT EXERCISE GENERATION & EXECUTION ENGINE
            // ==========================================
            const openUnitExerciseModal = () => {
                if (!activeSetId) return;
                const setCardsList = activeCards.filter(c => c.setId === activeSetId);
                if (setCardsList.length === 0) { showToast("Unit này chưa có từ vựng để làm bài tập!"); return; }
                setExerciseConfig(prev => ({ ...prev, questionCount: Math.min(10, setCardsList.length) }));
                setIsUnitExerciseModalOpen(true);
            };

            const startUnitExercise = async () => {
                if (!userApiKey) {
                    showToast("Vui lòng nhập Gemini API Key trong Settings để tạo bài tập AI!");
                    setIsApiKeyModalOpen(true);
                    return;
                }

                const unitCards = activeCards.filter(c => c.setId === activeSetId);
                if (unitCards.length === 0) { showToast("Unit này không có từ vựng!"); return; }

                const targetCount = Math.min(exerciseConfig.questionCount, unitCards.length);
                const selectedCards = fisherYatesShuffle(unitCards).slice(0, targetCount);

                setIsUnitExerciseModalOpen(false);
                setUnitQuizState({
                    questions: [],
                    currentIndex: 0,
                    userAnswers: {},
                    aiEvaluations: {},
                    isSubmitted: false,
                    isLoadingAI: true,
                    isEvaluating: false,
                    overallFeedback: null
                });
                setCurrentView('unit_quiz_play');
                setWrittenAnswerInput('');

                try {
                    const vocabSummary = selectedCards.map((c, i) => `${i+1}. Target Word: "${getCardWord(c)}", Meaning: "${getCardMeaning(c)}", Example: "${c.example || ''}"`).join('\n');

                    const prompt = `You are an AI American English Teacher creating interactive exercises for a Unit.
CRITICAL CONSTRAINT: You MUST strictly generate questions ONLY using target vocabulary from this current Unit list below. DO NOT use any words outside this Unit list as target answers.

Unit Target Vocabulary List:
${vocabSummary}

Exercise Instructions:
- Exercise Types requested: ${exerciseConfig.exerciseType} ('meaning_to_word', 'complete_sentence', 'make_sentence', or 'all')
- Response Format requested: ${exerciseConfig.answerFormat} ('multiple_choice', 'written', or 'mixed')
- Total Questions to Generate: ${selectedCards.length}

Type Definitions:
1. "meaning_to_word": Provide the English definition/meaning of the target word in "prompt". The student identifies the target word.
2. "complete_sentence": Create a natural sentence with "_______" where the target word fits in context.
3. "make_sentence": Set "prompt" to "Write a complete, natural English sentence using the target word: {targetWord}". (Always 'written' format).

Requirements:
- For 'multiple_choice' format: Provide 4 options in "options" array. One MUST be the correct targetWord. Distractors should be other words from this Unit or plausible choices.
- Use American English spelling, grammar, and natural phrasing.

JSON Schema Output:
[
  {
    "cardId": "matching card id if known",
    "targetWord": "exact target word from Unit",
    "type": "meaning_to_word | complete_sentence | make_sentence",
    "format": "multiple_choice | written",
    "prompt": "The question prompt or sentence with blank",
    "correctAnswer": "exact target word or answer",
    "options": ["Option A", "Option B", "Option C", "Option D"]
  }
]`;

                    const responseSchema = {
                        type: "ARRAY",
                        items: {
                            type: "OBJECT",
                            properties: {
                                cardId: { type: "STRING" },
                                targetWord: { type: "STRING" },
                                type: { type: "STRING" },
                                format: { type: "STRING" },
                                prompt: { type: "STRING" },
                                correctAnswer: { type: "STRING" },
                                options: { type: "ARRAY", items: { type: "STRING" } }
                            },
                            required: ["targetWord", "type", "format", "prompt", "correctAnswer"]
                        }
                    };

                    const rawJson = await callGeminiAPI(
                        prompt,
                        "You are an expert American English exercise generator. Use ONLY vocabulary from the provided Unit. Return JSON array matching schema.",
                        responseSchema,
                        userApiKey
                    );

                    const parsedQuestions = JSON.parse(rawJson);
                    const formattedQuestions = parsedQuestions.map((q, idx) => {
                        const matchedCard = selectedCards.find(c => getCardWord(c).toLowerCase() === (q.targetWord || '').toLowerCase()) || selectedCards[idx % selectedCards.length];
                        const format = q.type === 'make_sentence' ? 'written' : (exerciseConfig.answerFormat === 'mixed' ? (Math.random() > 0.5 ? 'multiple_choice' : 'written') : q.format || 'written');
                        
                        let opts = q.options;
                        if (format === 'multiple_choice' && (!opts || opts.length < 4)) {
                            const pool = unitCards.map(getCardWord).filter(w => w.toLowerCase() !== q.correctAnswer.toLowerCase());
                            const shuffledPool = fisherYatesShuffle(Array.from(new Set(pool))).slice(0, 3);
                            opts = fisherYatesShuffle([q.correctAnswer, ...shuffledPool]);
                        }

                        return {
                            id: 'q_' + idx + '_' + Date.now(),
                            cardId: matchedCard ? matchedCard.id : '',
                            targetWord: q.targetWord || getCardWord(matchedCard),
                            type: q.type || 'meaning_to_word',
                            format: format,
                            prompt: q.prompt,
                            correctAnswer: q.correctAnswer || getCardWord(matchedCard),
                            options: opts || []
                        };
                    });

                    setUnitQuizState(prev => ({
                        ...prev,
                        questions: formattedQuestions,
                        currentIndex: 0,
                        userAnswers: {},
                        aiEvaluations: {},
                        isSubmitted: false,
                        isLoadingAI: false
                    }));

                } catch (err) {
                    showToast("Lỗi khi tạo bài tập AI: " + err.message);
                    setCurrentView('set');
                    setUnitQuizState(prev => ({ ...prev, isLoadingAI: false }));
                }
            };

            const submitUnitQuestionAnswer = async (answerVal) => {
                const currentQ = unitQuizState.questions[unitQuizState.currentIndex];
                if (!currentQ || unitQuizState.aiEvaluations[currentQ.id]) return;

                const finalAnswer = (answerVal || writtenAnswerInput || '').trim();
                if (!finalAnswer) { showToast("Vui lòng nhập hoặc chọn câu trả lời!"); return; }

                const matchedCard = activeCards.find(c => c.id === currentQ.cardId || getCardWord(c).toLowerCase() === currentQ.targetWord.toLowerCase());

                if (currentQ.format === 'multiple_choice') {
                    const isRight = finalAnswer.toLowerCase() === currentQ.correctAnswer.toLowerCase();
                    const evalObj = {
                        correct: isRight,
                        score: isRight ? 100 : 0,
                        userAnswer: finalAnswer,
                        correctAnswer: currentQ.correctAnswer,
                        correction: isRight ? finalAnswer : currentQ.correctAnswer,
                        explanation: isRight 
                            ? `Chính xác! "${currentQ.correctAnswer}" có nghĩa là: ${matchedCard ? getCardMeaning(matchedCard) : ''}.`
                            : `Đáp án đúng là "${currentQ.correctAnswer}" (${matchedCard ? getCardMeaning(matchedCard) : ''}).`,
                        feedback: isRight ? "Rất tốt! Bạn đã chọn đúng từ vựng của Unit." : "Hãy ôn lại nghĩa và cách viết của từ vựng này."
                    };

                    setUnitQuizState(prev => ({
                        ...prev,
                        userAnswers: { ...prev.userAnswers, [currentQ.id]: finalAnswer },
                        aiEvaluations: { ...prev.aiEvaluations, [currentQ.id]: evalObj }
                    }));
                    return;
                }

                // WRITTEN ANSWER EVALUATION VIA AI
                setUnitQuizState(prev => ({ ...prev, isEvaluating: true }));

                try {
                    const prompt = `Evaluate student's answer for American English exercise.
Target Vocabulary Word: "${currentQ.targetWord}" (Meaning: "${matchedCard ? getCardMeaning(matchedCard) : ''}")
Exercise Type: "${currentQ.type}"
Question Prompt: "${currentQ.prompt}"
Expected Answer/Target: "${currentQ.correctAnswer}"
Student Answer: "${finalAnswer}"

Evaluation Rules:
1. For "meaning_to_word": Check if student wrote the correct word or a valid exact synonym. Allow minor typos if minor.
2. For "complete_sentence": Check if student's answer fits context, is grammatically correct, and uses correct target word form. If student wrote a valid, natural synonym that logically fits the sentence, ACCEPT IT as correct!
3. For "make_sentence": Check if student wrote a full valid sentence using target word (or inflected forms like 'traveled' if target is 'travel'). Check grammar, spelling, context, natural American English usage.
4. Evaluate based on American English standards.

JSON Schema Output:
{
  "correct": boolean,
  "score": number (0-100),
  "userAnswer": "${finalAnswer}",
  "correctAnswer": "${currentQ.correctAnswer}",
  "correction": "Corrected sentence or improved form if user had errors",
  "explanation": "Short, clear explanation of why it is correct/incorrect, key grammar or word usage point",
  "feedback": "Encouraging coaching feedback"
}`;

                    const responseSchema = {
                        type: "OBJECT",
                        properties: {
                            correct: { type: "BOOLEAN" },
                            score: { type: "NUMBER" },
                            userAnswer: { type: "STRING" },
                            correctAnswer: { type: "STRING" },
                            correction: { type: "STRING" },
                            explanation: { type: "STRING" },
                            feedback: { type: "STRING" }
                        },
                        required: ["correct", "score", "userAnswer", "correctAnswer", "explanation", "feedback"]
                    };

                    const evalText = await callGeminiAPI(
                        prompt,
                        "You are an American English language tutor. Grade student exercise answers accurately and constructively in JSON.",
                        responseSchema,
                        userApiKey
                    );

                    const evalResult = JSON.parse(evalText);

                    setUnitQuizState(prev => ({
                        ...prev,
                        isEvaluating: false,
                        userAnswers: { ...prev.userAnswers, [currentQ.id]: finalAnswer },
                        aiEvaluations: { ...prev.aiEvaluations, [currentQ.id]: evalResult }
                    }));

                } catch (err) {
                    setUnitQuizState(prev => ({ ...prev, isEvaluating: false }));
                    // Safe Fallback evaluation
                    const isRight = finalAnswer.toLowerCase().includes(currentQ.correctAnswer.toLowerCase());
                    const fallbackEval = {
                        correct: isRight,
                        score: isRight ? 100 : 0,
                        userAnswer: finalAnswer,
                        correctAnswer: currentQ.correctAnswer,
                        correction: currentQ.correctAnswer,
                        explanation: isRight ? "Câu trả lời của bạn chính xác." : `Đáp án gợi ý: "${currentQ.correctAnswer}"`,
                        feedback: isRight ? "Làm tốt lắm!" : "Cần rèn luyện thêm với từ này."
                    };

                    setUnitQuizState(prev => ({
                        ...prev,
                        userAnswers: { ...prev.userAnswers, [currentQ.id]: finalAnswer },
                        aiEvaluations: { ...prev.aiEvaluations, [currentQ.id]: fallbackEval }
                    }));
                }
            };

            const handleNextUnitQuestion = () => {
                if (unitQuizState.currentIndex + 1 < unitQuizState.questions.length) {
                    setUnitQuizState(prev => ({ ...prev, currentIndex: prev.currentIndex + 1 }));
                    setWrittenAnswerInput('');
                } else {
                    finishUnitQuizSession();
                }
            };

            const finishUnitQuizSession = async () => {
                const total = unitQuizState.questions.length;
                let correctCount = 0;
                let wrongCount = 0;

                unitQuizState.questions.forEach(q => {
                    const ev = unitQuizState.aiEvaluations[q.id];
                    if (ev && ev.correct) correctCount++;
                    else wrongCount++;
                });

                setCurrentView('unit_quiz_summary');

                // Generate Overall AI Feedback
                if (userApiKey) {
                    try {
                        const summaryData = unitQuizState.questions.map((q, idx) => {
                            const ev = unitQuizState.aiEvaluations[q.id] || {};
                            return `${idx+1}. Word: "${q.targetWord}", Type: ${q.type}, Student Answer: "${ev.userAnswer || ''}", Status: ${ev.correct ? 'Correct' : 'Incorrect'}`;
                        }).join('\n');

                        const prompt = `Student finished Unit practice test. Generate overall AI feedback summary based on ACTUAL errors.
Unit Title: "${currentSet ? currentSet.title : 'Unit'}"
Results: ${correctCount}/${total} correct.

Summary of Questions & Results:
${summaryData}

Requirements:
- Overall message evaluating their performance.
- List common mistake categories identified from their actual errors (e.g. Word Usage, Grammar, Spelling).
- List specific vocabulary words they need to review.

JSON Schema:
{
  "overallMsg": "Clear feedback message...",
  "commonMistakes": ["Mistake 1", "Mistake 2"],
  "reviewWords": ["Word 1", "Word 2"]
}`;

                        const schema = {
                            type: "OBJECT",
                            properties: {
                                overallMsg: { type: "STRING" },
                                commonMistakes: { type: "ARRAY", items: { type: "STRING" } },
                                reviewWords: { type: "ARRAY", items: { type: "STRING" } }
                            },
                            required: ["overallMsg", "commonMistakes", "reviewWords"]
                        };

                        const rawFeedback = await callGeminiAPI(prompt, "Provide constructive summary feedback in JSON based on actual exercise performance.", schema, userApiKey);
                        const parsedFb = JSON.parse(rawFeedback);
                        setUnitQuizState(prev => ({ ...prev, isSubmitted: true, overallFeedback: parsedFb }));
                    } catch (e) {
                        setUnitQuizState(prev => ({
                            ...prev,
                            isSubmitted: true,
                            overallFeedback: {
                                overallMsg: `Bạn đã hoàn thành bài tập với ${correctCount}/${total} câu đúng. Hãy tiếp tục duy trì!`,
                                commonMistakes: ["Cần lưu ý cách chia từ và chính tả"],
                                reviewWords: unitQuizState.questions.filter(q => !unitQuizState.aiEvaluations[q.id]?.correct).map(q => q.targetWord)
                            }
                        }));
                    }
                } else {
                    setUnitQuizState(prev => ({ ...prev, isSubmitted: true }));
                }
            };

            const activeFolders = folders.filter(f => !f.inTrash);
            const activeSets = sets.filter(s => !s.inTrash);
            const activeCards = cards.filter(c => !c.inTrash);
            const currentFolder = activeFolders.find(f => f.id === activeFolderId);
            const currentSet = activeSets.find(s => s.id === activeSetId);

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col md:flex-row font-sans antialiased">
                    <input type="file" ref={fileInputRef} onChange={handleImportJSON} accept=".json" className="hidden" />

                    {toastMessage && (
                        <div className="fixed top-5 right-5 z-50 bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-2 animate-bounce">
                            <Icons.Sparkles /> <span className="font-medium text-sm">{toastMessage}</span>
                        </div>
                    )}

                    {/* Sidebar */}
                    <aside className={`fixed md:static inset-y-0 left-0 z-40 w-72 bg-slate-950 border-r border-slate-800 flex flex-col transition-transform duration-300 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
                        <div className="p-5 border-b border-slate-800 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <span className="text-2xl">🇺🇸</span>
                                <div>
                                    <h1 className="font-bold text-lg text-amber-400 leading-tight">English AI</h1>
                                    <p className="text-xs text-slate-400">Learn American English</p>
                                </div>
                            </div>
                            <button onClick={() => setSidebarOpen(false)} className="md:hidden p-2 text-slate-400 hover:text-white rounded-lg"><Icons.Cross /></button>
                        </div>

                        <nav className="flex-1 overflow-y-auto p-4 space-y-2">
                            <button onClick={() => { setCurrentView('dashboard'); setActiveFolderId(null); setActiveSetId(null); setSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition-all ${currentView === 'dashboard' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200'}`}>
                                <Icons.Home /> Home & Folders
                            </button>
                            
                            <button onClick={() => { openQuickAiImportModal(); setSidebarOpen(false); }} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-amber-400 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 transition-all shadow-sm">
                                <Icons.Sparkles /> Nhập nhanh bằng AI
                            </button>

                            <button onClick={() => { setCurrentView('trash'); setSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition-all ${currentView === 'trash' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200'}`}>
                                <Icons.Trash /> Trash
                            </button>

                            <div className="pt-4 border-t border-slate-800/80 space-y-1">
                                <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider px-2">Settings</span>
                                <button onClick={() => setIsApiKeyModalOpen(true)} className="w-full flex items-center gap-2 px-3 py-2 text-xs font-medium text-slate-400 hover:text-amber-400 hover:bg-slate-900 rounded-lg transition-colors"><Icons.Key /> Gemini API Key</button>
                                <button onClick={exportDataJSON} className="w-full flex items-center gap-2 px-3 py-2 text-xs font-medium text-slate-400 hover:text-amber-400 hover:bg-slate-900 rounded-lg transition-colors"><Icons.Download /> Export JSON Backup</button>
                                <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="w-full flex items-center gap-2 px-3 py-2 text-xs font-medium text-slate-400 hover:text-emerald-400 hover:bg-slate-900 rounded-lg transition-colors"><Icons.Upload /> Import JSON Restore</button>
                            </div>

                            <div className="pt-4 mt-2 border-t border-slate-800/80">
                                <div className="flex items-center justify-between px-2 mb-2">
                                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">My Folders</span>
                                    <button onClick={() => { setEditingFolder(null); setFolderForm({ name: '', description: '' }); setIsFolderModalOpen(true); }} className="p-1 hover:bg-slate-800 text-amber-400 rounded-lg transition-colors" title="Create New Folder"><Icons.Plus /></button>
                                </div>
                                <div className="space-y-1">
                                    {activeFolders.length === 0 ? <p className="text-xs text-slate-500 px-2 py-1 italic">No folders yet</p> : activeFolders.map(f => (
                                        <SidebarFolderItem key={f.id} folder={f} countSets={activeSets.filter(s => s.folderId === f.id).length} isSelected={activeFolderId === f.id && (currentView === 'folder' || currentView === 'set' || currentView === 'study')} onSelect={() => { setActiveFolderId(f.id); setActiveSetId(null); setCurrentView('folder'); setSidebarOpen(false); }} onLongPressDelete={() => handleLongPressDeleteFolder(f)} />
                                    ))}
                                </div>
                            </div>
                        </nav>
                    </aside>

                    {/* Main Workspace */}
                    <div className="flex-1 flex flex-col min-w-0 relative">
                        <header className="h-16 border-b border-slate-800 bg-slate-950/80 backdrop-blur px-4 md:px-8 flex items-center justify-between sticky top-0 z-30">
                            <div className="flex items-center gap-3 overflow-hidden">
                                <button onClick={() => setSidebarOpen(true)} className="md:hidden p-2 -ml-2 text-slate-400 hover:text-white"><Icons.Menu /></button>
                                <div className="flex items-center gap-2 text-sm text-slate-400 overflow-x-auto whitespace-nowrap scrollbar-hide py-2">
                                    <button onClick={() => { setCurrentView('dashboard'); setActiveFolderId(null); setActiveSetId(null); }} className="hover:text-amber-400 flex items-center gap-1 flex-shrink-0"><Icons.Home /> Home</button>
                                    
                                    {currentFolder && <><Icons.ChevronRight /><button onClick={() => { setCurrentView('folder'); setActiveSetId(null); }} className={`hover:text-amber-400 flex-shrink-0 ${!currentSet ? 'text-white font-semibold' : ''}`}>Folder: {currentFolder.name}</button></>}
                                    {currentSet && <><Icons.ChevronRight /><span className={`flex-shrink-0 max-w-[150px] md:max-w-xs truncate ${currentView !== 'study' && currentView !== 'unit_quiz_play' && currentView !== 'unit_quiz_summary' ? 'text-white font-semibold' : ''}`}>Unit: {currentSet.title}</span></>}
                                    
                                    {(currentView === 'unit_quiz_play' || currentView === 'unit_quiz_summary') && <><Icons.ChevronRight /><span className="text-amber-400 font-semibold flex-shrink-0">{currentView === 'unit_quiz_summary' ? 'Kết quả Bài tập' : 'Làm Bài tập AI'}</span></>}
                                </div>
                            </div>
                        </header>

                        <main className="flex-1 p-4 md:p-8 overflow-y-auto relative">
                            
                            {/* DASHBOARD */}
                            {currentView === 'dashboard' && (
                                <div className="max-w-6xl mx-auto space-y-8 animate-fade-in">
                                    <div className="bg-gradient-to-r from-amber-600/20 via-slate-800 to-slate-900 border border-amber-500/20 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <h2 className="text-2xl font-bold text-white flex items-center gap-2">Welcome! 🇺🇸</h2>
                                            <p className="text-slate-400 text-sm mt-1">Hệ thống học tiếng Anh Mỹ thông minh với Flashcard linh hoạt & Bài tập AI theo từng Unit.</p>
                                        </div>
                                        <div className="flex flex-wrap gap-2 flex-shrink-0">
                                            <button onClick={() => openQuickAiImportModal()} className="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl flex items-center gap-2 shadow-lg transition-transform hover:scale-105 text-sm"><Icons.Sparkles /> Nhập nhanh bằng AI</button>
                                            <button onClick={() => { setEditingFolder(null); setFolderForm({ name: '', description: '' }); setIsFolderModalOpen(true); }} className="bg-slate-800 hover:bg-slate-700 text-white font-semibold px-4 py-2.5 rounded-xl flex items-center gap-2 border border-slate-700 transition-all text-sm"><Icons.Plus /> Create Folder</button>
                                        </div>
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-200 flex items-center gap-2 mb-4"><Icons.Folder /> Folders List ({activeFolders.length})</h3>
                                        {activeFolders.length === 0 ? <div className="bg-slate-950/50 border border-dashed border-slate-800 rounded-2xl p-8 text-center"><p className="text-slate-400 mb-4">No folders yet. Create your first one!</p></div> : 
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {activeFolders.map(f => <FolderGridCard key={f.id} folder={f} folderSetsCount={activeSets.filter(s => s.folderId === f.id).length} onSelect={() => { setActiveFolderId(f.id); setCurrentView('folder'); }} onEdit={(e) => { e.stopPropagation(); setEditingFolder(f); setFolderForm({ name: f.name, description: f.description || '' }); setIsFolderModalOpen(true); }} onLongPressDelete={() => handleLongPressDeleteFolder(f)} />)}
                                        </div>}
                                    </div>
                                </div>
                            )}

                            {/* FOLDER VIEW */}
                            {currentView === 'folder' && currentFolder && (
                                <div className="max-w-6xl mx-auto space-y-6 animate-fade-in">
                                    <div className="bg-slate-950 border border-slate-800 rounded-2xl p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <div className="flex items-center gap-2 text-amber-400 text-xs font-semibold uppercase tracking-wider mb-1"><Icons.Folder /> Folder</div>
                                            <h2 className="text-2xl font-bold text-white">{currentFolder.name}</h2>
                                        </div>
                                        <div className="flex items-center gap-3 flex-wrap">
                                            <button onClick={() => openQuickAiImportModal()} className="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold px-4 py-2 rounded-xl flex items-center gap-2 shadow-lg transition-transform hover:scale-105 text-sm"><Icons.Sparkles /> Nhập nhanh bằng AI</button>
                                            <button onClick={() => { setEditingSet(null); setSetForm({ title: '', description: '', folderId: currentFolder.id }); setIsSetModalOpen(true); }} className="bg-slate-800 hover:bg-slate-700 text-white font-semibold px-4 py-2 rounded-xl flex items-center gap-2 border border-slate-700 transition-all text-sm"><Icons.Plus /> Add Study Set / Unit</button>
                                        </div>
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-bold text-slate-200 flex items-center gap-2 mb-4"><Icons.Book /> Sets in this folder</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {activeSets.filter(s => s.folderId === currentFolder.id).map(s => <SetGridCard key={s.id} setItem={s} cardsCount={activeCards.filter(c => c.setId === s.id).length} onSelect={() => { setActiveSetId(s.id); setCurrentView('set'); }} onEdit={(e) => { e.stopPropagation(); setEditingSet(s); setSetForm({ title: s.title, description: s.description || '', folderId: s.folderId }); setIsSetModalOpen(true); }} onLongPressDelete={() => handleLongPressDeleteSet(s)} />)}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* SET / UNIT VIEW */}
                            {currentView === 'set' && currentSet && (
                                <div className="max-w-4xl mx-auto space-y-6 animate-fade-in">
                                    <div className="bg-slate-950 border-b-4 border-amber-500 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                                        <div className="relative z-10">
                                            <div className="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">Unit / Học phần</div>
                                            <h2 className="text-3xl font-bold text-white mb-2">{currentSet.title}</h2>
                                            {currentSet.description && <p className="text-slate-400 text-sm mb-4">{currentSet.description}</p>}
                                            <div className="flex flex-wrap items-center gap-3 mt-4">
                                                <button onClick={startStudy} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-5 py-3 rounded-xl flex items-center gap-2 shadow-lg"><Icons.Study /> Flashcards</button>
                                                <button onClick={openUnitExerciseModal} className="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold px-5 py-3 rounded-xl flex items-center gap-2 shadow-lg transition-transform hover:scale-105"><Icons.Quiz /> 🎯 Bài tập AI Unit</button>
                                                <button onClick={() => openQuickAiImportModal(currentSet.id)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold px-5 py-3 rounded-xl flex items-center gap-2 transition-all"><Icons.Sparkles /> Nhập bằng AI</button>
                                                <button onClick={() => { setEditingCard(null); setCardForm({ english: '', vietnamese: '', example: '', exampleTranslation: '', imageUrl: '', plural: '', partOfSpeech: 'noun', ipa: '' }); setIsCardModalOpen(true); }} className="bg-slate-800 hover:bg-slate-700 text-white font-semibold px-4 py-3 rounded-xl flex items-center gap-2 border border-slate-700 transition-all text-sm"><Icons.Plus /> Add Word</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="text-lg font-bold text-slate-200 flex items-center gap-2"><Icons.Card /> Cards List ({activeCards.filter(c => c.setId === currentSet.id).length})</h3>
                                        </div>
                                        <div className="space-y-3">
                                            {activeCards.filter(c => c.setId === currentSet.id).length === 0 ? (
                                                <div className="bg-slate-950/50 border border-dashed border-slate-800 rounded-2xl p-8 text-center">
                                                    <p className="text-slate-400 mb-4">Chưa có từ vựng trong Unit này.</p>
                                                    <button onClick={() => openQuickAiImportModal(currentSet.id)} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl inline-flex items-center gap-2"><Icons.Sparkles /> Thêm từ bằng AI</button>
                                                </div>
                                            ) : (
                                                activeCards.filter(c => c.setId === currentSet.id).map(card => (
                                                    <FlashcardListItem key={card.id} card={card} onEdit={(e) => { setEditingCard(card); setCardForm({ english: getCardWord(card), vietnamese: getCardMeaning(card), example: card.example || '', exampleTranslation: card.exampleTranslation || '', imageUrl: card.imageUrl || '', plural: card.plural || '', partOfSpeech: card.partOfSpeech || 'noun', ipa: card.ipa || '' }); setIsCardModalOpen(true); }} onToggleLearned={toggleCardLearned} onLongPressDelete={() => handleLongPressDeleteCard(card)} />
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                                                </div>
