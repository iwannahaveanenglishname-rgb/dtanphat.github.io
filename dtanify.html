                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Folder</label>
                                        <select value={setForm.folderId} onChange={(e) => setSetForm({ ...setForm, folderId: e.target.value })} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500">
                                            <option value="">-- Select Folder (Optional) --</option>
                                            {activeFolders.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Unit / Set Title</label>
                                        <input type="text" required value={setForm.title} onChange={(e) => setSetForm({ ...setForm, title: e.target.value })} placeholder="e.g. Lesson 1: Food & Restaurant" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Description</label>
                                        <textarea value={setForm.description} onChange={(e) => setSetForm({ ...setForm, description: e.target.value })} placeholder="Optional description..." className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 h-20 resize-none" />
                                    </div>
                                </div>
                                <div className="flex justify-end gap-3 pt-2">
                                    <button type="button" onClick={() => setIsSetModalOpen(false)} className="px-5 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 font-semibold text-sm">Cancel</button>
                                    <button type="submit" className="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-sm shadow-lg">Save Set</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* CARD MODAL */}
                    {isCardModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <form onSubmit={handleSaveCard} className="bg-slate-900 border border-slate-700 rounded-3xl p-6 md:p-8 max-w-lg w-full space-y-4 shadow-2xl animate-fade-in max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-bold text-white">{editingCard ? 'Edit Word Card' : 'Add New Word Card'}</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">English Word</label>
                                        <input type="text" required value={cardForm.english} onChange={(e) => setCardForm({ ...cardForm, english: e.target.value })} placeholder="e.g. restaurant" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Part of Speech</label>
                                        <select value={cardForm.partOfSpeech} onChange={(e) => setCardForm({ ...cardForm, partOfSpeech: e.target.value })} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500">
                                            <option value="noun">noun (n.)</option>
                                            <option value="verb">verb (v.)</option>
                                            <option value="adjective">adjective (adj.)</option>
                                            <option value="adverb">adverb (adv.)</option>
                                            <option value="preposition">preposition (prep.)</option>
                                            <option value="conjunction">conjunction (conj.)</option>
                                            <option value="pronoun">pronoun (pron.)</option>
                                            <option value="interjection">interjection (interj.)</option>
                                            <option value="phrase">phrase (phr.)</option>
                                            <option value="phrasal verb">phrasal verb (phr. v.)</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">IPA Pronunciation</label>
                                        <input type="text" value={cardForm.ipa} onChange={(e) => setCardForm({ ...cardForm, ipa: e.target.value })} placeholder="e.g. /ˈres.tə.rɑːnt/" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 font-mono text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Vietnamese Meaning</label>
                                        <input type="text" required value={cardForm.vietnamese} onChange={(e) => setCardForm({ ...cardForm, vietnamese: e.target.value })} placeholder="e.g. nhà hàng" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Example Sentence</label>
                                    <input type="text" value={cardForm.example} onChange={(e) => setCardForm({ ...cardForm, example: e.target.value })} placeholder="e.g. We had dinner at a small restaurant." className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500" />
                                </div>
                                <div className="flex justify-end gap-3 pt-3">
                                    <button type="button" onClick={() => setIsCardModalOpen(false)} className="px-5 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 font-semibold text-sm">Cancel</button>
                                    <button type="submit" className="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-sm shadow-lg">Save Card</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* QUICK AI IMPORT MODAL */}
                    {isAiImportModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 md:p-8 max-w-2xl w-full space-y-5 shadow-2xl animate-fade-in max-h-[90vh] overflow-y-auto">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <h3 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Sparkles /> Nhập Từ Vựng Bằng AI</h3>
                                    <button onClick={() => setIsAiImportModalOpen(false)} className="text-slate-400 hover:text-white p-1"><Icons.Cross /></button>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Chọn Unit / Học phần đích</label>
                                        <select value={targetImportSetId} onChange={(e) => setTargetImportSetId(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500">
                                            {activeSets.length === 0 ? <option value="">-- Chưa có Unit nào --</option> : activeSets.map(s => <option key={s.id} value={s.id}>{s.title}</option>)}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Danh sách từ tiếng Anh (Mỗi từ 1 dòng hoặc cách nhau bởi dấu phẩy)</label>
                                        <textarea value={importRawText} onChange={(e) => setImportRawText(e.target.value)} placeholder="restaurant, reservation, crowded, delicious, environment..." className="w-full bg-slate-800 border border-slate-700 rounded-xl p-4 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 h-32 resize-none font-mono text-sm" />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Ghi chú ngữ cảnh thêm cho AI (Tùy chọn)</label>
                                        <input type="text" value={customPromptNote} onChange={(e) => setCustomPromptNote(e.target.value)} placeholder="Ví dụ: Chủ đề từ vựng du lịch khách sạn..." className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 text-sm" />
                                    </div>

                                    <button disabled={isAiImporting || !importRawText.trim()} onClick={handleRunAiImport} className="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                                        {isAiImporting ? <><div className="w-5 h-5 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></div> AI đang phân tích & tạo thẻ...</> : <><Icons.Sparkles /> Bắt đầu tạo Flashcard</>}
                                    </button>

                                    {aiImportError && <p className="text-xs text-rose-400 bg-rose-950/40 border border-rose-500/30 p-3 rounded-xl">{aiImportError}</p>}

                                    {/* PREVIEW GENERATED CARDS */}
                                    {aiPreviewCards.length > 0 && (
                                        <div className="space-y-3 pt-2">
                                            <h4 className="font-bold text-sm text-emerald-400 flex items-center gap-2"><Icons.Check /> Xem trước {aiPreviewCards.length} từ đã tạo:</h4>
                                            <div className="max-h-48 overflow-y-auto space-y-2 border border-slate-800 p-2 rounded-xl bg-slate-950">
                                                {aiPreviewCards.map((item, idx) => (
                                                    <div key={idx} className="p-2.5 bg-slate-900 rounded-lg text-xs flex items-center justify-between">
                                                        <div>
                                                            <span className="font-bold text-white">{item.word}</span> <span className="text-amber-400 font-mono">({getPosAbbreviation(item.partOfSpeech)})</span> <span className="text-slate-400 font-mono">{item.ipa}</span>
                                                            <p className="text-emerald-400 font-semibold mt-0.5">{item.meaning}</p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                            <button onClick={handleSaveAiImportedCards} className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition-all">Lưu tất cả vào Unit</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* UNIT EXERCISE CONFIG MODAL */}
                    {isUnitExerciseModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 md:p-8 max-w-md w-full space-y-5 shadow-2xl animate-fade-in">
                                <h3 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Quiz /> Tùy Chỉnh Bài Tập AI</h3>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Loại Dạng Bài Tập</label>
                                        <select value={exerciseConfig.exerciseType} onChange={(e) => setExerciseConfig({ ...exerciseConfig, exerciseType: e.target.value })} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500">
                                            <option value="all">Tất cả các dạng (Đa dạng)</option>
                                            <option value="meaning_to_word">Đoán từ qua Định nghĩa / Nghĩa</option>
                                            <option value="complete_sentence">Điền từ thích hợp vào câu</option>
                                            <option value="make_sentence">Đặt câu tiếng Anh hoàn chỉnh</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Hình Thức Trả Lời</label>
                                        <select value={exerciseConfig.answerFormat} onChange={(e) => setExerciseConfig({ ...exerciseConfig, answerFormat: e.target.value })} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500">
                                            <option value="written">Tự luận / Tự gõ từ & đặt câu (AI Chấm)</option>
                                            <option value="multiple_choice">Trắc nghiệm Choose 1 of 4</option>
                                            <option value="mixed">Xen kẽ Cả hai hình thức</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Số lượng câu hỏi</label>
                                        <input type="number" min="1" max="20" value={exerciseConfig.questionCount} onChange={(e) => setExerciseConfig({ ...exerciseConfig, questionCount: parseInt(e.target.value) || 5 })} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500" />
                                    </div>
                                </div>

                                <div className="flex justify-end gap-3 pt-2">
                                    <button type="button" onClick={() => setIsUnitExerciseModalOpen(false)} className="px-5 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 font-semibold text-sm">Hủy</button>
                                    <button type="button" onClick={startUnitExercise} className="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-sm shadow-lg flex items-center gap-2"><Icons.Quiz /> Bắt Đầu Làm Bài</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* API KEY MODAL */}
                    {isApiKeyModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 md:p-8 max-w-md w-full space-y-5 shadow-2xl animate-fade-in">
                                <h3 className="text-xl font-bold text-amber-400 flex items-center gap-2"><Icons.Key /> Gemini API Key Settings</h3>
                                <p className="text-xs text-slate-400 leading-relaxed">Nhập Gemini API Key của bạn để sử dụng các tính năng AI Import từ vựng và Chấm bài tập AI tự động.</p>
                                <input type="password" value={userApiKey} onChange={(e) => setUserApiKey(e.target.value)} placeholder="AIzaSy..." className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 font-mono text-sm" />
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setIsApiKeyModalOpen(false)} className="px-4 py-2 text-slate-400 hover:text-white text-sm">Cancel</button>
                                    <button onClick={() => saveApiKey(userApiKey)} className="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-sm shadow-lg">Save API Key</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CONFIRM DIALOG */}
                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-sm w-full space-y-4 text-center shadow-2xl animate-fade-in">
                                <p className="text-slate-200 font-medium text-base">{confirmDialog.message}</p>
                                <div className="flex justify-center gap-3 pt-2">
                                    <button onClick={() => setConfirmDialog({ isOpen: false, message: '', onConfirm: null })} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl font-medium text-sm hover:bg-slate-700">Hủy</button>
                                    <button onClick={confirmDialog.onConfirm} className="px-5 py-2 bg-rose-600 text-white rounded-xl font-bold text-sm hover:bg-rose-500 shadow-lg">Xác nhận</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
