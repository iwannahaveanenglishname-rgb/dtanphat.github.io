                                                <div className="space-y-2">
                                                    {trashedFolders.map(f => (
                                                        <div key={f.id} className="bg-slate-950 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
                                                            <span className="font-semibold text-slate-200">{f.name}</span>
                                                            <div className="flex items-center gap-2">
                                                                <button onClick={() => handleRestoreFolder(f.id)} className="p-2 text-emerald-400 hover:bg-slate-800 rounded-lg text-xs font-semibold flex items-center gap-1"><Icons.Undo /> Restore</button>
                                                                <button onClick={() => setConfirmDialog({ isOpen: true, message: `Permanently delete folder "${f.name}"?`, onConfirm: () => handlePermanentDeleteFolder(f.id) })} className="p-2 text-rose-400 hover:bg-slate-800 rounded-lg text-xs font-semibold flex items-center gap-1"><Icons.Trash /> Delete</button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* Trashed Sets */}
                                        {trashedSets.length > 0 && (
                                            <div>
                                                <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Study Sets</h3>
                                                <div className="space-y-2">
                                                    {trashedSets.map(s => (
                                                        <div key={s.id} className="bg-slate-950 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
                                                            <span className="font-semibold text-slate-200">{s.title}</span>
                                                            <div className="flex items-center gap-2">
                                                                <button onClick={() => handleRestoreSet(s.id)} className="p-2 text-emerald-400 hover:bg-slate-800 rounded-lg text-xs font-semibold flex items-center gap-1"><Icons.Undo /> Restore</button>
                                                                <button onClick={() => setConfirmDialog({ isOpen: true, message: `Permanently delete set "${s.title}"?`, onConfirm: () => handlePermanentDeleteSet(s.id) })} className="p-2 text-rose-400 hover:bg-slate-800 rounded-lg text-xs font-semibold flex items-center gap-1"><Icons.Trash /> Delete</button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* Trashed Cards */}
                                        {trashedCards.length > 0 && (
                                            <div>
                                                <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Cards</h3>
                                                <div className="space-y-2">
                                                    {trashedCards.map(c => (
                                                        <div key={c.id} className="bg-slate-950 border border-slate-800 p-4 rounded-xl flex items-center justify-between">
                                                            <span className="font-semibold text-slate-200">{c.article ? c.article + ' ' : ''}{c.german} ({c.vietnamese})</span>
                                                            <div className="flex items-center gap-2">
                                                                <button onClick={() => handleRestoreCard(c.id)} className="p-2 text-emerald-400 hover:bg-slate-800 rounded-lg text-xs font-semibold flex items-center gap-1"><Icons.Undo /> Restore</button>
                                                                <button onClick={() => setConfirmDialog({ isOpen: true, message: `Permanently delete card "${c.german}"?`, onConfirm: () => handlePermanentDeleteCard(c.id) })} className="p-2 text-rose-400 hover:bg-slate-800 rounded-lg text-xs font-semibold flex items-center gap-1"><Icons.Trash /> Delete</button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {trashedFolders.length === 0 && trashedSets.length === 0 && trashedCards.length === 0 && (
                                            <div className="bg-slate-950/50 border border-dashed border-slate-800 rounded-2xl p-12 text-center text-slate-500">
                                                Trash bin is currently empty.
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>

                    {}
                    {isQuizConfigOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-950 border border-slate-800 rounded-3xl p-6 md:p-8 max-w-lg w-full shadow-2xl space-y-6 animate-fade-in max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                                    <h3 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Quiz /> Select Exercise Type</h3>
                                    <button onClick={() => setIsQuizConfigOpen(false)} className="text-slate-400 hover:text-white p-2 rounded-lg"><Icons.Cross /></button>
                                </div>

                                <div className="space-y-4">
                                    {/* Exercise Type Options */}
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Exercise Mode</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {[
                                                { id: 'mixed', label: 'Mixed Exercises', desc: 'Combines all types' },
                                                { id: 'ai_prompt', label: '✨ AI Exercise', desc: 'Custom prompt request' },
                                                { id: 'gender', label: 'Noun Gender', desc: 'der, die, das' },
                                                { id: 'plural', label: 'Plural Practice', desc: 'Noun plurals' },
                                                { id: 'spelling', label: 'Spelling', desc: 'Write target words' },
                                                { id: 'fill_blank', label: 'AI Fill-in-Blank', desc: 'Context sentences' },
                                            ].map(m => (
                                                <button
                                                    key={m.id}
                                                    type="button"
                                                    onClick={() => setQuizConfig({ ...quizConfig, quizMode: m.id })}
                                                    className={`p-3 rounded-xl border text-left transition-all ${quizConfig.quizMode === m.id ? 'bg-amber-500/20 border-amber-500 text-amber-400 font-bold' : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'}`}
                                                >
                                                    <div className="text-sm">{m.label}</div>
                                                    <div className="text-[10px] text-slate-400 font-normal">{m.desc}</div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* FEATURE 1: AI Exercise Custom Prompt Textarea & Example Chips */}
                                    {quizConfig.quizMode === 'ai_prompt' && (
                                        <div className="space-y-3 bg-slate-900/90 p-4 rounded-2xl border border-amber-500/40 animate-fade-in">
                                            <label className="block text-xs font-bold text-amber-400 uppercase tracking-wider">
                                                Describe your exercise instructions
                                            </label>
                                            <textarea
                                                rows="3"
                                                value={quizConfig.customPrompt}
                                                onChange={(e) => setQuizConfig({ ...quizConfig, customPrompt: e.target.value })}
                                                placeholder="e.g. Make me an exercise about German accusative articles, or create 10 questions using vocabulary from this unit..."
                                                className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 resize-none"
                                            ></textarea>
                                            <div>
                                                <span className="text-[11px] text-slate-400 block mb-1.5 font-medium">Click an example prompt:</span>
                                                <div className="flex flex-wrap gap-1.5">
                                                    {[
                                                        "Make me an exercise about German accusative articles.",
                                                        "Create 10 questions using the vocabulary from this unit.",
                                                        "Make me a German exercise about word order.",
                                                        "Create a fill-in-the-blank exercise using these vocabulary words.",
                                                        "Make me a mixed exercise about German past tense."
                                                    ].map((preset, pIdx) => (
                                                        <button
                                                            key={pIdx}
                                                            type="button"
                                                            onClick={() => setQuizConfig({ ...quizConfig, customPrompt: preset })}
                                                            className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700 transition-colors text-left"
                                                        >
                                                            {preset}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Format selector */}
                                    {quizConfig.quizMode !== 'ai_prompt' && (
                                        <div>
                                            <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Answer Format</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                {[
                                                    { id: 'mixed', label: 'Mixed' },
                                                    { id: 'multiple_choice', label: 'Multiple Choice' },
                                                    { id: 'written', label: 'Written' }
                                                ].map(f => (
                                                    <button
                                                        key={f.id}
                                                        type="button"
                                                        onClick={() => setQuizConfig({ ...quizConfig, answerFormat: f.id })}
                                                        className={`p-2.5 text-xs text-center rounded-xl border transition-all ${quizConfig.answerFormat === f.id ? 'bg-amber-500/20 border-amber-500 text-amber-400 font-bold' : 'bg-slate-900 border-slate-800 text-slate-400'}`}
                                                    >
                                                        {f.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <button
                                    onClick={() => startQuiz(false)}
                                    className="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition-all"
                                >
                                    Start Exercise
                                </button>
                            </div>
                        </div>
                    )}

                    {/* API Key Modal */}
                    {isApiKeyModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-950 border border-slate-800 rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl space-y-4 animate-fade-in">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="text-lg font-bold text-amber-400 flex items-center gap-2"><Icons.Key /> Gemini API Key</h3>
                                    <button onClick={() => setIsApiKeyModalOpen(false)} className="text-slate-400 hover:text-white"><Icons.Cross /></button>
                                </div>
                                <p className="text-xs text-slate-400">Your API key is required to power AI Quick Imports and AI Exercises.</p>
                                <input
                                    type="password"
                                    value={userApiKey}
                                    onChange={(e) => setUserApiKey(e.target.value)}
                                    placeholder="AIzaSy..."
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500 font-mono"
                                />
                                <button onClick={() => saveApiKey(userApiKey)} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition-all">Save Key</button>
                            </div>
                        </div>
                    )}

                    {/* Folder Form Modal */}
                    {isFolderModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <form onSubmit={handleSaveFolder} className="bg-slate-950 border border-slate-800 rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl space-y-4 animate-fade-in">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="text-lg font-bold text-white">{editingFolder ? 'Edit Folder' : 'New Folder'}</h3>
                                    <button type="button" onClick={() => setIsFolderModalOpen(false)} className="text-slate-400 hover:text-white"><Icons.Cross /></button>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Folder Name</label>
                                    <input type="text" required value={folderForm.name} onChange={(e) => setFolderForm({ ...folderForm, name: e.target.value })} placeholder="e.g. A2 Grammar & Vocabulary" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Description</label>
                                    <textarea rows="2" value={folderForm.description} onChange={(e) => setFolderForm({ ...folderForm, description: e.target.value })} placeholder="Optional description..." className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500 resize-none"></textarea>
                                </div>
                                <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition-all">Save Folder</button>
                            </form>
                        </div>
                    )}

                    {/* Set Form Modal */}
                    {isSetModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <form onSubmit={handleSaveSet} className="bg-slate-950 border border-slate-800 rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl space-y-4 animate-fade-in">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="text-lg font-bold text-white">{editingSet ? 'Edit Study Set' : 'New Study Set'}</h3>
                                    <button type="button" onClick={() => setIsSetModalOpen(false)} className="text-slate-400 hover:text-white"><Icons.Cross /></button>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Set Title</label>
                                    <input type="text" required value={setForm.title} onChange={(e) => setSetForm({ ...setForm, title: e.target.value })} placeholder="e.g. Lektion 2: Food & Drinks" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Description</label>
                                    <textarea rows="2" value={setForm.description} onChange={(e) => setSetForm({ ...setForm, description: e.target.value })} placeholder="Optional description..." className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500 resize-none"></textarea>
                                </div>
                                <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition-all">Save Set</button>
                            </form>
                        </div>
                    )}

                    {/* Card Form Modal */}
                    {isCardModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <form onSubmit={handleSaveCard} className="bg-slate-950 border border-slate-800 rounded-3xl p-6 md:p-8 max-w-lg w-full shadow-2xl space-y-4 animate-fade-in max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="text-lg font-bold text-white">{editingCard ? 'Edit Flashcard' : 'Add Flashcard'}</h3>
                                    <button type="button" onClick={() => setIsCardModalOpen(false)} className="text-slate-400 hover:text-white"><Icons.Cross /></button>
                                </div>
                                
                                <div className="grid grid-cols-3 gap-2">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Article</label>
                                        <select value={cardForm.article} onChange={(e) => setCardForm({ ...cardForm, article: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
                                            <option value="">None</option>
                                            <option value="der">der</option>
                                            <option value="die">die</option>
                                            <option value="das">das</option>
                                        </select>
                                    </div>
                                    <div className="col-span-2">
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">German Word</label>
                                        <input type="text" required value={cardForm.german} onChange={(e) => setCardForm({ ...cardForm, german: e.target.value })} placeholder="Apfel" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500" />
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 gap-2">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Plural</label>
                                        <input type="text" value={cardForm.plural} onChange={(e) => setCardForm({ ...cardForm, plural: e.target.value })} placeholder="die Äpfel" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">IPA Phonetic</label>
                                        <input type="text" value={cardForm.ipa} onChange={(e) => setCardForm({ ...cardForm, ipa: e.target.value })} placeholder="/ˈapfəl/" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Type Tag</label>
                                        <select value={cardForm.partOfSpeech} onChange={(e) => setCardForm({ ...cardForm, partOfSpeech: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
                                            <option value="">None</option>
                                            <option value="adj">Adjective (adj)</option>
                                            <option value="adv">Adverb (adv)</option>
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Translation / Meaning</label>
                                    <input type="text" required value={cardForm.vietnamese} onChange={(e) => setCardForm({ ...cardForm, vietnamese: e.target.value })} placeholder="Apple" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500" />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Example Sentence</label>
                                    <input type="text" value={cardForm.example} onChange={(e) => setCardForm({ ...cardForm, example: e.target.value })} placeholder="Der Apfel ist rot." className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500" />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Example Translation</label>
                                    <input type="text" value={cardForm.exampleTranslation} onChange={(e) => setCardForm({ ...cardForm, exampleTranslation: e.target.value })} placeholder="The apple is red." className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500" />
                                </div>

                                <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition-all">Save Card</button>
                            </form>
                        </div>
                    )}

                    {/* Quick AI Import Modal */}
                    {isAiImportModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-950 border border-slate-800 rounded-3xl p-6 md:p-8 max-w-lg w-full shadow-2xl space-y-4 animate-fade-in">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <h3 className="text-lg font-bold text-amber-400 flex items-center gap-2"><Icons.Sparkles /> Quick Import via AI</h3>
                                    <button onClick={() => setIsAiImportModalOpen(false)} className="text-slate-400 hover:text-white"><Icons.Cross /></button>
                                </div>
                                <p className="text-xs text-slate-400">Paste any raw German text or vocabulary list below. AI will automatically extract words, articles, plurals, IPA, and translations.</p>
                                <textarea
                                    rows="5"
                                    value={importRawText}
                                    onChange={(e) => setImportRawText(e.target.value)}
                                    placeholder="Paste German text or vocabulary list here..."
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500 resize-none font-mono"
                                ></textarea>
                                <div>
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Optional Note for AI</label>
                                    <input type="text" value={customPromptNote} onChange={(e) => setCustomPromptNote(e.target.value)} placeholder="e.g. Focus on A1 food words" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-amber-500" />
                                </div>
                                <button
                                    onClick={handleAIImport}
                                    disabled={isAiImporting}
                                    className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2"
                                >
                                    {isAiImporting ? 'Processing with AI...' : 'Generate Flashcards'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Confirmation Dialog */}
                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-950 border border-slate-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4 animate-fade-in text-center">
                                <h4 className="text-lg font-bold text-white">{confirmDialog.message}</h4>
                                <div className="flex justify-center gap-3">
                                    <button onClick={() => setConfirmDialog({ isOpen: false, message: '', onConfirm: null })} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-4 py-2 rounded-xl border border-slate-700 text-sm">Cancel</button>
                                    <button onClick={confirmDialog.onConfirm} className="bg-rose-600 hover:bg-rose-500 text-white font-bold px-4 py-2 rounded-xl text-sm shadow-lg">Confirm Delete</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
