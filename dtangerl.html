                { id: 'card_demo_2', setId: 'set_demo_1', article: 'das', german: 'Bier', ipa: '/biːɐ̯/', partOfSpeech: '', plural: 'die Biere', vietnamese: 'Bia', example: 'Möchten Sie ein Bier trinken?', exampleTranslation: 'Bạn có muốn uống một ly bia không?', imageUrl: '', createdAt: new Date().toISOString().split('T')[0], isLearned: false, inTrash: false },

            ]

        // German Vowel Parser Helper
        function parseGermanWordVowels(word) {
            if (!word || typeof word !== 'string') return [{ text: word || '', type: 'normal' }];

            const matches = [];

            // 1. Long double vowels (ie, aa, ee, oo)
            const reLongDouble = /(ie|aa|ee|oo|IE|AA|EE|OO|Ie|Aa|Ee|Oo)/g;
            let m;
            while ((m = reLongDouble.exec(word)) !== null) {
                matches.push({ start: m.index, end: m.index + m[0].length, type: 'long', text: m[0] });
            }

            // 2. Vowel + silent h (ah, eh, ih, oh, uh, äh, öh, üh)
            const reVowelH = /([aeiouäöüAEIOUÄÖÜ]h)/g;
            while ((m = reVowelH.exec(word)) !== null) {
                const start = m.index;
                const end = start + m[0].length;
                if (!matches.some(existing => (start >= existing.start && start < existing.end) || (end > existing.start && end <= existing.end))) {
                    matches.push({ start, end, type: 'long', text: m[0] });
                }
            }

            // 3. Vowel before ß
            const reVowelSz = /([aeiouäöüAEIOUÄÖÜ])(?=ß|β)/g;
            while ((m = reVowelSz.exec(word)) !== null) {
                const start = m.index;
                const end = start + m[0].length;
                if (!matches.some(existing => (start >= existing.start && start < existing.end) || (end > existing.start && end <= existing.end))) {
                    matches.push({ start, end, type: 'long', text: m[0] });
                }
            }

            // 4. Short vowel before double consonants / short vowel triggers
            const reShort = /([aeiouäöüAEIOUÄÖÜ])(?=(?:pp|tt|kk|mm|nn|rr|ff|ss|ll|zz|ck|tz|ng|nk|sch))/g;
            while ((m = reShort.exec(word)) !== null) {
                const start = m.index;
                const end = start + m[0].length;
                if (!matches.some(existing => (start >= existing.start && start < existing.end) || (end > existing.start && end <= existing.end))) {
                    matches.push({ start, end, type: 'short', text: m[0] });
                }
            }

            // Sort matches
            matches.sort((a, b) => a.start - b.start);

            // Filter overlaps
            const filteredMatches = [];
            let lastEnd = 0;
            for (const item of matches) {
                if (item.start >= lastEnd) {
                    filteredMatches.push(item);
                    lastEnd = item.end;
                }
            }

            // Build output segments
            const segments = [];
            let currIdx = 0;
            for (const item of filteredMatches) {
                if (item.start > currIdx) {
                    segments.push({ text: word.slice(currIdx, item.start), type: 'normal' });
                }
                segments.push({ text: word.slice(item.start, item.end), type: item.type });
                currIdx = item.end;
            }
            if (currIdx < word.length) {
                segments.push({ text: word.slice(currIdx), type: 'normal' });
            }

            return segments;
        }

        // Inline Vowel Component
        const VowelMarkedText = ({ word, className = "" }) => {
            if (!word) return null;
            const segments = parseGermanWordVowels(word);

            return (
                <span className={`inline-flex items-baseline tracking-normal ${className}`}>
                    {segments.map((seg, idx) => {
                        if (seg.type === 'short') {
                            return (
                                <span key={idx} className="relative inline-block font-bold">
                                    {seg.text}
                                    <span className="absolute left-1/2 -translate-x-1/2 -bottom-[0.45em] text-[0.45em] leading-none text-amber-400 select-none pointer-events-none font-black">●</span>
                                </span>
                            );
                        }
                        if (seg.type === 'long') {
                            return (
                                <span key={idx} className="relative inline-block font-bold">
                                    {seg.text}
                                    <span className="absolute left-0 right-0 -bottom-[0.18em] h-[2.5px] bg-amber-400 rounded-full select-none pointer-events-none"></span>
                                </span>
                            );
                        }
                        return <span key={idx}>{seg.text}</span>;
                    })}
                </span>
            );
        };

        // Normalize Part of Speech (Only 'adj' or 'adv' allowed)
        const getNormalizedPOS = (posStr) => {
            if (!posStr) return null;
            const pos = posStr.toString().toLowerCase().trim();
            if (pos === 'adj' || pos === 'adjective' || pos.startsWith('adj')) return 'adj';
            if (pos === 'adv' || pos === 'adverb' || pos.startsWith('adv')) return 'adv';
            return null;
        };

        function fisherYatesShuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        const getTodayString = () => new Date().toISOString().split('T')[0];

        const playAudio = (text, lang) => {
            if (!text) return;
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel(); 
                const u = new SpeechSynthesisUtterance(text);
                u.lang = lang;
                
                const voices = window.speechSynthesis.getVoices();
                if (voices.length > 0) {
                    const matchedVoices = voices.filter(v => v.lang.startsWith(lang) || v.lang.startsWith(lang.replace('-', '_')));
                    if (matchedVoices.length > 0) {
                        const preferred = matchedVoices.find(v => v.name.includes('Google') || v.name.includes('Online') || v.name.includes('Premium')) || matchedVoices[0];
                        u.voice = preferred;
                    }
                }
                
                window.speechSynthesis.speak(u);
            }
        };

        function useLongPress(onLongPress, onClick, { delay = 600 } = {}) {
            const timerRef = useRef(null);
            const isLongPressRef = useRef(false);

            const start = useCallback((e) => {
                if (e.type === 'mousedown' && e.button !== 0) return;
                isLongPressRef.current = false;
                timerRef.current = setTimeout(() => {
                    isLongPressRef.current = true;
                    if (window.navigator && window.navigator.vibrate) {
                        try { window.navigator.vibrate(50); } catch (err) {}
                    }
                    onLongPress(e);
                }, delay);
            }, [onLongPress, delay]);

            const stop = useCallback(() => {
                if (timerRef.current) {
                    clearTimeout(timerRef.current);
                    timerRef.current = null;
                }
            }, []);

            const handleClick = useCallback((e) => {
                if (isLongPressRef.current) {
                    e.stopPropagation();
                    e.preventDefault();
                    isLongPressRef.current = false;
                    return;
                }
                if (onClick) {
                    onClick(e);
                }
            }, [onClick]);

            return { onMouseDown: start, onMouseUp: stop, onMouseLeave: stop, onTouchStart: start, onTouchEnd: stop, onTouchMove: stop, onClick: handleClick };
        }

        const callGeminiAPI = async (prompt, systemInstruction = "", responseSchema = null, customApiKey = "") => {
            const apiKey = customApiKey.trim();
            if (!apiKey) {
                throw new Error("API key is missing. Please check your Gemini API key in Settings.");
            }
            
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            if (responseSchema) payload.generationConfig = { responseMimeType: "application/json", responseSchema: responseSchema };
            
            try {
                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!res.ok) {
                    let errorMsg = `HTTP Error ${res.status}`;
                    try {
                        const errData = await res.json();
                        if (errData && errData.error && errData.error.message) {
                            errorMsg = errData.error.message;
                        }
                    } catch (e) {
                        try {
                            errorMsg = await res.text();
                        } catch (tErr) {
                            errorMsg = `Status ${res.status}`;
                        }
                    }
                    throw new Error(`API Error: [${res.status}] - ${errorMsg}`);
                }
                
                const data = await res.json();
                
                const candidate = data.candidates && data.candidates[0];
                const parts = candidate && candidate.content && candidate.content.parts;
                if (!parts || parts.length === 0) {
                    throw new Error("Invalid response format received from AI API.");
                }

                const textPart = parts.find(p => p.text && !p.thought) || parts.find(p => p.text) || parts[0];
                if (!textPart || typeof textPart.text !== 'string') {
                    throw new Error("No text content found in AI API response.");
                }

                return textPart.text;
            } catch (err) {
                if (err.message && (err.message.includes('Failed to fetch') || err.message.includes('NetworkError'))) {
                    throw new Error("Network Error: Unable to connect to AI API. Please check your internet connection.");
                }
                throw err;
            }
        };

        const getDistractors = (correctStr, allCards, mapFn, fallbackDistractors = ['A', 'B', 'C']) => {
            let pool = allCards.map(mapFn).filter(v => v && v.toLowerCase() !== correctStr.toLowerCase());
            pool = Array.from(new Set(pool));
            if (pool.length < 3) return fallbackDistractors.slice(0, 3);
            return fisherYatesShuffle(pool).slice(0, 3);
        };

            return (
                <div 
                    {...pressHandlers}
                    className="group relative bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-2xl p-5 cursor-pointer transition-all transform hover:-translate-y-1 hover:shadow-xl hover:border-amber-500/30 overflow-hidden"

                        <div className="p-3 bg-amber-500/10 text-amber-400 rounded-xl">

                        </button>
                    </div>
                    <h4 className="font-bold text-lg text-white mb-1 truncate">{folder.name}</h4>
                    <p className="text-sm text-slate-400 line-clamp-2 mb-3 min-h-[40px]">{folder.description || 'No description'}</p>
                    <div className="flex items-center text-xs text-slate-500 font-medium bg-slate-900/50 inline-block px-3 py-1.5 rounded-lg">
                        {folderSetsCount} Sets
                    </div>

        const SetGridCard = ({ setItem, cardsCount, onSelect, onEdit, onLongPressDelete }) => {
            const pressHandlers = useLongPress(onLongPressDelete, onSelect);
            return (
                <div 
                    {...pressHandlers}
                    className="group bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-2xl p-5 cursor-pointer transition-all transform hover:-translate-y-1 hover:shadow-xl overflow-hidden flex flex-col"
                >
                    <div className="flex justify-between items-start mb-2">
                        <div className="flex items-center gap-2 text-emerald-400 text-xs font-bold uppercase tracking-wider mb-2">
                            <Icons.Book /> Study Set
                        </div>
                        <button onClick={onEdit} className="p-1.5 text-slate-400 hover:text-white hover:bg-slate-600 rounded-lg transition-colors">
                            <Icons.Edit />
                        </button>
                    </div>
                    <h4 className="font-bold text-lg text-white mb-1 line-clamp-2 flex-1">{setItem.title}</h4>
                    {setItem.description && <p className="text-sm text-slate-400 line-clamp-1 mb-4">{setItem.description}</p>}
                    
                    <div className="flex items-center justify-between mt-auto pt-3 border-t border-slate-700">
                        <span className="text-xs text-slate-400 font-medium bg-slate-900 px-2.5 py-1 rounded-md">{cardsCount} Cards</span>
                        <span className="text-xs text-slate-500">{setItem.createdAt}</span>
                    </div>
                </div>
            );
        };

        const FlashcardListItem = ({ card, onEdit, onToggleLearned, onLongPressDelete }) => {
            const pressHandlers = useLongPress(onLongPressDelete, onEdit);
            const articleColor = card.article === 'der' ? 'text-blue-400' : 
                                 card.article === 'die' ? 'text-rose-400' : 
                                 card.article === 'das' ? 'text-emerald-400' : 'text-slate-400';

            const posTag = getNormalizedPOS(card.partOfSpeech);

            return (
                <div 
                    {...pressHandlers}
                    className={`group flex flex-col p-4 rounded-xl border transition-all cursor-pointer ${card.isLearned ? 'bg-slate-900/50 border-slate-800 opacity-60' : 'bg-slate-800 hover:bg-slate-700 border-slate-700 hover:border-slate-500'}`}
                >
                    <div className="flex items-center justify-between">
                        <div className="flex items-center gap-4 flex-1 overflow-hidden">
                            <button 
                                onClick={(e) => { e.stopPropagation(); onToggleLearned(card); }}
                                className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-colors ${card.isLearned ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-500 text-transparent hover:border-emerald-500'}`}
                            >
                                <Icons.Check />
                            </button>
                            <div className="flex-1 min-w-0 grid grid-cols-1 md:grid-cols-2 gap-2 md:gap-4">
                                <div className="truncate">
                                    {card.article && <span className={`font-bold mr-1.5 ${articleColor}`}>{card.article}</span>}
                                    <span className="text-lg text-white font-bold truncate inline-block pb-1">
                                        <VowelMarkedText word={card.german} />
                                    </span>
                                    {card.ipa && <span className="text-xs font-mono text-slate-400 ml-2">[{card.ipa}]</span>}
                                    {posTag && <span className="text-xs font-mono font-bold px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30 ml-2">{posTag}</span>}
                                    {card.plural && <span className="text-sm text-slate-400 ml-2">({card.plural})</span>}
                                    {card.example && <p className="text-xs text-slate-400 truncate mt-0.5 italic">{card.example}</p>}
                                    {card.exampleTranslation && <p className="text-xs text-slate-500 truncate mt-0.5">{card.exampleTranslation}</p>}
                                </div>
                                <div className="truncate flex items-center text-slate-300">
                                    <span className="truncate font-semibold">{card.vietnamese}</span>
                                </div>
                            </div>
                        </div>
                        
                        {card.imageUrl && (
                            <div className="hidden md:block w-12 h-12 rounded-lg bg-slate-900 overflow-hidden ml-4 flex-shrink-0">
                                <img src={card.imageUrl} alt={card.german} className="w-full h-full object-cover" onError={(e) => e.target.style.display = 'none'} />
                            </div>
                        )}
                        
                        <div className="flex items-center ml-4 gap-1">
                            <button onClick={(e) => { e.stopPropagation(); onEdit(e); }} className="p-2 text-slate-400 hover:text-white rounded-lg">
                                <Icons.Edit />
                            </button>
                        </div>
                    </div>

                    <div className="flex items-center gap-2 mt-3 pt-3 border-t border-slate-700/50">
                        <button onClick={(e) => { e.stopPropagation(); playAudio((card.article ? card.article + ' ' : '') + card.german, 'de-DE'); }} className="flex items-center gap-1 text-xs px-2 py-1 bg-slate-900 rounded-md text-slate-400 hover:text-amber-400 transition-colors">
                            <Icons.Speaker /> German
                        </button>
                        {card.plural && (
                            <button onClick={(e) => { e.stopPropagation(); playAudio(card.plural, 'de-DE'); }} className="flex items-center gap-1 text-xs px-2 py-1 bg-slate-900 rounded-md text-slate-400 hover:text-amber-400 transition-colors">
                                <Icons.Speaker /> Plural
                            </button>
                        )}
                        <button onClick={(e) => { e.stopPropagation(); playAudio(card.vietnamese, 'en-US'); }} className="flex items-center gap-1 text-xs px-2 py-1 bg-slate-900 rounded-md text-slate-400 hover:text-emerald-400 transition-colors">
                            <Icons.Speaker /> Translation
                        </button>
                    </div>
                </div>
            );
        };

        function App() {
            const [folders, setFolders] = useState([]);
            const [sets, setSets] = useState([]);
            const [cards, setCards] = useState([]);
            const [userApiKey, setUserApiKey] = useState('');
            const [isApiKeyModalOpen, setIsApiKeyModalOpen] = useState(false);
            const [currentView, setCurrentView] = useState('dashboard');
            const [activeFolderId, setActiveFolderId] = useState(null);
            const [activeSetId, setActiveSetId] = useState(null);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            
            const [isFolderModalOpen, setIsFolderModalOpen] = useState(false);
            const [editingFolder, setEditingFolder] = useState(null);
            const [folderForm, setFolderForm] = useState({ name: '', description: '' });
            
            const [isSetModalOpen, setIsSetModalOpen] = useState(false);
            const [editingSet, setEditingSet] = useState(null);
            const [setForm, setSetForm] = useState({ title: '', description: '', folderId: '' });
            
            const [isCardModalOpen, setIsCardModalOpen] = useState(false);
            const [editingCard, setEditingCard] = useState(null);
            const [cardForm, setCardForm] = useState({ german: '', article: '', ipa: '', partOfSpeech: '', plural: '', vietnamese: '', example: '', exampleTranslation: '', imageUrl: '' });
            
            const [isAiImportModalOpen, setIsAiImportModalOpen] = useState(false);
            const [importRawText, setImportRawText] = useState('');
            const [customPromptNote, setCustomPromptNote] = useState('');
            const [isAiImporting, setIsAiImporting] = useState(false);
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, message: '', onConfirm: null });
            const [toastMessage, setToastMessage] = useState(null);
            const [studySession, setStudySession] = useState({ cards: [], currentIndex: 0, isFlipped: false, showResult: false, direction: 'de-en' });
            
            const [isQuizConfigOpen, setIsQuizConfigOpen] = useState(false);
            const [quizConfig, setQuizConfig] = useState({
                quizMode: 'mixed',      
                difficulty: 'medium',
                answerFormat: 'mixed'
            });

            const [quizState, setQuizState] = useState({
                questions: [],
                currentIndex: 0,
                userAnswers: {},
                isSubmitted: false,
                score: 0,
                wrongQuestions: [],
                answeredQuestions: [],
                isTest2: false,
                isLoadingAI: false
            });

            const [writtenInput, setWrittenInput] = useState('');
            const fileInputRef = useRef(null);
            const writtenInputRef = useRef(null);
            const [currentCheckResult, setCurrentCheckResult] = useState(null);

            useEffect(() => {
                loadLocalData();
                const key = localStorage.getItem(API_KEY_STORAGE_KEY);
                if (key) setUserApiKey(key);
            }, []);

            useEffect(() => {
                if (quizState.questions.length > 0) {
                    localStorage.setItem(QUIZ_STATE_STORAGE_KEY, JSON.stringify(quizState));
                }
            }, [quizState]);

            useEffect(() => {
                localStorage.setItem(VIEW_STATE_STORAGE_KEY, currentView);
            }, [currentView]);

            useEffect(() => {
                if (currentView === 'quiz_play' && !currentCheckResult && writtenInputRef.current) {
                    const timer = setTimeout(() => {
                        if (writtenInputRef.current) writtenInputRef.current.focus();
                    }, 50);
                    return () => clearTimeout(timer);
                }
            }, [currentView, quizState.currentIndex, currentCheckResult]);
            
            useEffect(() => {
                if (currentView === 'quiz_play' && quizState.questions.length > 0) {
                    const currentQ = quizState.questions[quizState.currentIndex];
                    if (currentQ.type === 'listen' && !currentCheckResult) {
                        playAudio(currentQ.germanSpeech, 'de-DE');
                    }
                }
            }, [quizState.currentIndex, currentView]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const loadLocalData = () => {
                try {
                    const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        setFolders(parsed.folders || []);
                        setSets(parsed.sets || []);
                        setCards(parsed.cards || []);
                    } else {
                        setFolders(defaultSampleData.folders);
                        setSets(defaultSampleData.sets);
                        setCards(defaultSampleData.cards);
                        saveToLocalStorage(defaultSampleData.folders, defaultSampleData.sets, defaultSampleData.cards);
                    }
                    const savedQuiz = localStorage.getItem(QUIZ_STATE_STORAGE_KEY);
                    if (savedQuiz) setQuizState(JSON.parse(savedQuiz));
                    const savedView = localStorage.getItem(VIEW_STATE_STORAGE_KEY);
                    if (savedView) setCurrentView(savedView);
                } catch (e) {
                    setFolders(defaultSampleData.folders); setSets(defaultSampleData.sets); setCards(defaultSampleData.cards);
                }
            };

            const saveToLocalStorage = (newFolders, newSets, newCards) => {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({ folders: newFolders, sets: newSets, cards: newCards }));
            };

            const saveApiKey = (keyStr) => {
                setUserApiKey(keyStr); localStorage.setItem(API_KEY_STORAGE_KEY, keyStr);
                showToast("API Key saved successfully!"); setIsApiKeyModalOpen(false);
            };

            const exportDataJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ folders, sets, cards, exportDate: new Date().toISOString() }, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr); downloadAnchor.setAttribute("download", `Deutsch_AI_Backup_${getTodayString()}.json`);
                document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove();
                showToast("Backup downloaded successfully!");
            };

            const handleImportJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported.folders && imported.sets && imported.cards) {
                            setFolders(imported.folders); setSets(imported.sets); setCards(imported.cards);
                            saveToLocalStorage(imported.folders, imported.sets, imported.cards);
                            showToast("Data imported successfully!");
                        } else alert("Invalid JSON structure!");
                    } catch (err) { alert("Cannot read this JSON file!"); }
                };
                reader.readAsText(file);
            };

            const handleSaveFolder = async (e) => {
                if (e) e.preventDefault();
                if (!folderForm.name.trim()) return;
                const folderId = editingFolder ? editingFolder.id : 'folder_' + Date.now();
                const data = { id: folderId, name: folderForm.name.trim(), description: folderForm.description.trim(), createdAt: editingFolder ? editingFolder.createdAt : getTodayString(), inTrash: editingFolder ? editingFolder.inTrash : false };
                const updated = editingFolder ? folders.map(f => f.id === folderId ? data : f) : [...folders, data];
                setFolders(updated); saveToLocalStorage(updated, sets, cards);
                showToast(editingFolder ? "Folder updated!" : "New folder created!");
                setIsFolderModalOpen(false);
                if (!editingFolder) { setActiveFolderId(folderId); setCurrentView('folder'); }
            };

            const handleSoftDeleteFolder = (folderId) => {
                const updated = folders.map(f => f.id === folderId ? { ...f, inTrash: true } : f);
                setFolders(updated); saveToLocalStorage(updated, sets, cards);
                showToast("Folder moved to trash!");
                if (activeFolderId === folderId) { setCurrentView('dashboard'); setActiveFolderId(null); }
                setConfirmDialog({ isOpen: false, message: '', onConfirm: null });
            };

            const handleLongPressDeleteFolder = (folder) => setConfirmDialog({ isOpen: true, message: `Move folder "${folder.name}" to trash?`, onConfirm: () => handleSoftDeleteFolder(folder.id) });

            const handleSaveSet = async (e) => {
                if(e) e.preventDefault();
                if (!setForm.title.trim()) return;
                const targetFolderId = setForm.folderId || activeFolderId || '';
                const setId = editingSet ? editingSet.id : 'set_' + Date.now();
                const data = { id: setId, title: setForm.title.trim(), description: setForm.description.trim(), folderId: targetFolderId, createdAt: editingSet ? editingSet.createdAt : getTodayString(), inTrash: editingSet ? editingSet.inTrash : false };
                const updated = editingSet ? sets.map(s => s.id === setId ? data : s) : [...sets, data];
                setSets(updated); saveToLocalStorage(folders, updated, cards);
                showToast(editingSet ? "Set updated!" : "New set created!");
                setIsSetModalOpen(false);
                if (!editingSet) { setActiveSetId(setId); setCurrentView('set'); }
            };

            const handleSoftDeleteSet = (setId) => {
                const updated = sets.map(s => s.id === setId ? { ...s, inTrash: true } : s);
                setSets(updated); saveToLocalStorage(folders, updated, cards);
                showToast("Set moved to trash!");
                if (activeSetId === setId) { setCurrentView(activeFolderId ? 'folder' : 'dashboard'); setActiveSetId(null); }
                setConfirmDialog({ isOpen: false, message: '', onConfirm: null });
            };

            const handleLongPressDeleteSet = (setItem) => setConfirmDialog({ isOpen: true, message: `Move set "${setItem.title}" to trash?`, onConfirm: () => handleSoftDeleteSet(setItem.id) });

            const handleSaveCard = async (e) => {
                if(e) e.preventDefault();
                if (!cardForm.german.trim() || !cardForm.vietnamese.trim()) return;
                if (!activeSetId) return;

                const cardId = editingCard ? editingCard.id : 'card_' + Date.now();
                const data = {
                    id: cardId, setId: activeSetId, german: cardForm.german.trim(), article: cardForm.article || '', ipa: cardForm.ipa?.trim() || '', partOfSpeech: cardForm.partOfSpeech || '', plural: cardForm.plural?.trim() || '',
                    vietnamese: cardForm.vietnamese.trim(), example: cardForm.example.trim(), exampleTranslation: cardForm.exampleTranslation?.trim() || '', imageUrl: cardForm.imageUrl.trim(),
                    createdAt: editingCard ? editingCard.createdAt : getTodayString(), isLearned: editingCard ? editingCard.isLearned : false, inTrash: editingCard ? editingCard.inTrash : false
                };
                const updated = editingCard ? cards.map(c => c.id === cardId ? data : c) : [...cards, data];
                setCards(updated); saveToLocalStorage(folders, sets, updated);
                showToast(editingCard ? "Card updated!" : "New card created!");
                setIsCardModalOpen(false);
            };

            const handleSoftDeleteCard = (cardId) => {
                const updated = cards.map(c => c.id === cardId ? { ...c, inTrash: true } : c);
                setCards(updated); saveToLocalStorage(folders, sets, updated);
                showToast("Card moved to trash!");
                setConfirmDialog({ isOpen: false, message: '', onConfirm: null });
            };

            const handleLongPressDeleteCard = (card) => setConfirmDialog({ isOpen: true, message: `Delete card "${card.article ? card.article + ' ' : ''}${card.german}"?`, onConfirm: () => handleSoftDeleteCard(card.id) });

            const toggleCardLearned = (card) => {
                const updated = cards.map(c => c.id === card.id ? { ...c, isLearned: !card.isLearned } : c);
                setCards(updated); saveToLocalStorage(folders, sets, updated);
            };

            const handleAIImport = async () => {
                if (!importRawText.trim() || !activeSetId) return;
                setIsAiImporting(true);
                
                let systemInstruction = "You are a professional German teacher. Extract vocabulary from the user's text and create a valid JSON array for flashcards.";
                let prompt = `Extract German vocabulary from the following text:\n---\n${importRawText}\n---`;
                if (customPromptNote.trim()) prompt += `\n\n📌 SPECIAL INSTRUCTIONS:\n"${customPromptNote.trim()}"`;
                prompt += `\n\nReturn a JSON array of objects with keys:
                - "german": base word without article (preserve exact casing)
                - "article": der/die/das or empty
                - "ipa": IPA phonetic transcription
                - "partOfSpeech": "adj" if adjective, "adv" if adverb, or empty string "" for any other word type
                - "plural": plural form or empty
                - "english": meaning/translation
                - "example": German example sentence
                - "exampleTranslation": translation of the example sentence`;

                const schema = {
                    type: "ARRAY", items: { type: "OBJECT", properties: {
                        german: { type: "STRING" }, article: { type: "STRING" }, ipa: { type: "STRING" }, partOfSpeech: { type: "STRING" }, plural: { type: "STRING" }, english: { type: "STRING" }, example: { type: "STRING" }, exampleTranslation: { type: "STRING" }
                    }, required: ["german", "english"] }
                };

                try {
                    const rawJson = await callGeminiAPI(prompt, systemInstruction, schema, userApiKey);
                    let parsedArray;
                    try {
                        parsedArray = JSON.parse(rawJson);
                    } catch (parseErr) {
                        throw new Error("AI returned invalid JSON format. Please try again.");
                    }
                    
                    if (Array.isArray(parsedArray) && parsedArray.length > 0) {
                        const today = getTodayString();
                        const newCreatedCards = parsedArray.map((item, index) => {
                            let pos = getNormalizedPOS(item.partOfSpeech) || '';
                            return {
                                id: 'card_' + Date.now() + '_' + index, setId: activeSetId, german: item.german || '', article: item.article || '', ipa: item.ipa || '', partOfSpeech: pos, plural: item.plural || '',
                                vietnamese: item.english || '', example: item.example || '', exampleTranslation: item.exampleTranslation || '', imageUrl: '',
                                createdAt: today, isLearned: false, inTrash: false
                            };
                        });
                        const updated = [...cards, ...newCreatedCards];
                        setCards(updated); saveToLocalStorage(folders, sets, updated);
                        showToast(`Successfully created ${parsedArray.length} cards via AI!`);
                        setIsAiImportModalOpen(false); setImportRawText('');
                    } else {
                        showToast("AI could not find valid vocabulary.");
                    }
                } catch (err) {
                    showToast(err.message || "An unexpected error occurred during AI Import.");
                } finally { setIsAiImporting(false); }
            };

            const startStudy = () => {
                if (!activeSetId) return;
                const setCardsList = activeCards.filter(c => c.setId === activeSetId);
                if (setCardsList.length === 0) { showToast("This set is empty!"); return; }
                let unlearnedCards = setCardsList.filter(c => !c.isLearned);
                let cardsToStudy = unlearnedCards.length > 0 ? unlearnedCards : setCardsList;
                
                setStudySession({ cards: fisherYatesShuffle(cardsToStudy), currentIndex: 0, isFlipped: false, showResult: false, direction: 'de-en' });
                setCurrentView('study');
            };

            const nextStudyCard = (markAsLearned) => {
                const currentCard = studySession.cards[studySession.currentIndex];
                if (markAsLearned && !currentCard.isLearned) toggleCardLearned(currentCard);
                if (studySession.currentIndex + 1 < studySession.cards.length) {
                    setStudySession(prev => ({ ...prev, currentIndex: prev.currentIndex + 1, isFlipped: false }));
                } else {
                    setStudySession(prev => ({ ...prev, showResult: true }));
                }
            };

            const buildQuizQuestions = (targetCardsList, allSetCards, config, isTest2 = false, retestCardIds = []) => {
                let pool = [];
                let cardsToProcess = [...targetCardsList];

                if (isTest2 && retestCardIds.length > 0) cardsToProcess = targetCardsList.filter(c => retestCardIds.includes(c.id));
                if (cardsToProcess.length === 0) cardsToProcess = targetCardsList;

                const requestedFormat = config.answerFormat || 'mixed';

                cardsToProcess.forEach(card => {
                    const de = card.german.trim();
                    const en = card.vietnamese.trim();
                    const fullDe = card.article ? `${card.article} ${de}` : de;
                    
                    let possibleTypes = [];

                    if (config.quizMode === 'gender' && card.article) possibleTypes = ['gender'];
                    else if (config.quizMode === 'plural' && card.plural) possibleTypes = ['plural'];
                    else if (config.quizMode === 'spelling') possibleTypes = ['spelling'];
                    else if (config.quizMode === 'listen_type') possibleTypes = ['listen'];
                    else if (config.quizMode === 'mixed') {
                        possibleTypes = ['translation', 'spelling', 'listen'];
                        if (card.article && ['der', 'die', 'das'].includes(card.article.toLowerCase())) possibleTypes.push('gender');
                        if (card.plural && card.plural.trim() !== '') possibleTypes.push('plural');
                    } else {
                        possibleTypes = ['spelling'];
                    }

                    const chosenType = possibleTypes[Math.floor(Math.random() * possibleTypes.length)] || 'spelling';
                    const qId = chosenType + '_' + card.id + '_' + Math.random().toString(36).substring(2, 7);

                    let finalFormat = requestedFormat;
                    if (requestedFormat === 'mixed') {
                        finalFormat = Math.random() > 0.5 ? 'multiple_choice' : 'written';
                    }

                    let qObj = {
                        id: qId, cardId: card.id, type: chosenType, format: finalFormat, cardObj: card
                    };

                    if (chosenType === 'listen') {
                        qObj.title = 'Exercise: Listen & Answer';
                        qObj.prompt = `What did you hear?`;
                        qObj.correctAnswer = fullDe;
                        qObj.altCorrectAnswer = de;
                        qObj.germanSpeech = fullDe;
                        if (finalFormat === 'multiple_choice') {
                            const distractors = getDistractors(fullDe, allSetCards, c => (c.article ? c.article + ' ' : '') + c.german);
                            qObj.options = fisherYatesShuffle([fullDe, ...distractors]);
                        }
                    } else if (chosenType === 'plural') {
                        qObj.title = 'Exercise: Guess Noun Plural';
                        qObj.prompt = `Plural form for:\n"${fullDe}" ➔ ________`;
                        qObj.subtext = `Translation: ${en}`;
                        qObj.correctAnswer = card.plural.trim();
                        qObj.altCorrectAnswer = card.plural.replace(/^(der|die|das)\s+/i, '').trim();
                        qObj.germanSpeech = de;
                        if (finalFormat === 'multiple_choice') {
                            const distractors = getDistractors(card.plural.trim(), allSetCards, c => c.plural, [`die ${de}s`, `die ${de}en`, `die ${de}e`]);
                            qObj.options = fisherYatesShuffle([card.plural.trim(), ...distractors]);
                        }
                    } else if (chosenType === 'spelling') {
                        qObj.title = 'Exercise: Spelling';
                        qObj.prompt = `German word for: "${en}"`;
                        qObj.subtext = card.article ? `(Include article if noun)` : '';
                        qObj.correctAnswer = fullDe;
                        qObj.altCorrectAnswer = de;
                        qObj.germanSpeech = fullDe;
                        if (finalFormat === 'multiple_choice') {
                            const distractors = getDistractors(fullDe, allSetCards, c => (c.article ? c.article + ' ' : '') + c.german);
                            qObj.options = fisherYatesShuffle([fullDe, ...distractors]);
                        }
                    } else if (chosenType === 'gender') {
                        qObj.title = 'Exercise: Guess Noun Gender';
                        qObj.prompt = `___ ${de}`;
                        qObj.subtext = `Translation: ${en}`;
                        qObj.correctAnswer = card.article.toLowerCase();
                        qObj.germanSpeech = fullDe;
                        if (finalFormat === 'multiple_choice') {
                            qObj.options = ['der', 'die', 'das'];
                        }
                    } else if (chosenType === 'translation') {
                        const dir = Math.random() > 0.5 ? 'de_en' : 'en_de';
                        if (dir === 'de_en') {
                            qObj.title = 'Translation (DE ➔ EN)';
                            qObj.prompt = `Meaning of "${fullDe}"?`;
                            qObj.correctAnswer = en;
                            qObj.germanSpeech = fullDe;
                            if (finalFormat === 'multiple_choice') {
                                const distractors = getDistractors(en, allSetCards, c => c.vietnamese);
                                qObj.options = fisherYatesShuffle([en, ...distractors]);
                            }
                        } else {
                            qObj.title = 'Translation (EN ➔ DE)';
                            qObj.prompt = `German word for "${en}"?`;
                            qObj.correctAnswer = fullDe;
                            qObj.altCorrectAnswer = de;
                            qObj.germanSpeech = fullDe;
                            if (finalFormat === 'multiple_choice') {
                                const distractors = getDistractors(fullDe, allSetCards, c => (c.article ? c.article + ' ' : '') + c.german);
                                qObj.options = fisherYatesShuffle([fullDe, ...distractors]);
                            }
                        }
                    }
                    pool.push(qObj);
                });

                return fisherYatesShuffle(pool);
            };

            const generateFillBlankAI = async (targetCardsList, difficulty, requestedFormat = 'mixed', allSetCards) => {
                const wordsList = targetCardsList.map(c => c.german).join(", ");
                let diffInstruction = 'natural context, slightly longer.';
                if (difficulty === 'easy') diffInstruction = 'simple sentence, clear context.';
                if (difficulty === 'hard') diffInstruction = 'complex context, advanced grammar.';
                
                const prompt = `You are a German teacher creating Fill-in-the-Blank exercises.
                Difficulty: ${difficulty.toUpperCase()}. ${diffInstruction}
                
                For EACH of the following words, create exactly ONE sentence where that exact word is missing.
                Words list: ${wordsList}
                
                CRITICAL RULES:
                1. Replace the target word in the German sentence EXACTLY with "________" (8 underscores).
                2. Do not include the answer in the sentence.
                3. The grammar must perfectly match the correct answer.
                
                Output JSON Array format:
                [
                  {
                    "wordId": "(I will map this later)",
                    "germanWord": "the exact word from the list",
                    "sentenceWithBlank": "Ich muss mich heute ________.",
                    "correctAnswer": "entscheiden",
                    "englishTranslation": "I have to make a decision today."
                  }
                ]`;

                const schema = {
                    type: "ARRAY", items: {
                        type: "OBJECT", properties: {
                            germanWord: {type: "STRING"}, sentenceWithBlank: {type: "STRING"}, correctAnswer: {type: "STRING"}, englishTranslation: {type: "STRING"}
                        }, required: ["germanWord", "sentenceWithBlank", "correctAnswer", "englishTranslation"]
                    }
                };

                const rawJson = await callGeminiAPI(prompt, "", schema, userApiKey);
                const parsed = JSON.parse(rawJson);
                
                let pool = [];
                targetCardsList.forEach(card => {
                    const de = card.german.trim();
                    const aiData = parsed.find(item => item.germanWord.toLowerCase() === de.toLowerCase() || item.correctAnswer.toLowerCase() === de.toLowerCase());
                    
                    let finalFormat = requestedFormat;
                    if (requestedFormat === 'mixed') finalFormat = Math.random() > 0.5 ? 'multiple_choice' : 'written';
                    
                    let qObj = {
                        id: 'fill_' + card.id + '_' + Math.random().toString(36).substring(2, 7),
                        cardId: card.id, type: 'fill_blank', format: finalFormat,
                        title: 'Exercise: Fill in the Blank',
                        cardObj: card
                    };
                    
                    if (aiData) {
                        qObj.prompt = aiData.sentenceWithBlank;
                        qObj.subtext = `Translation: ${aiData.englishTranslation}`;
                        qObj.correctAnswer = aiData.correctAnswer;
                        qObj.germanSpeech = aiData.sentenceWithBlank.replace('________', aiData.correctAnswer);
                    } else {
                        qObj.prompt = `________ ist wichtig.`;
                        qObj.subtext = `Translation: ${card.vietnamese} is important.`;
                        qObj.correctAnswer = de;
                        qObj.germanSpeech = `${de} ist wichtig.`;
                    }

                    if (finalFormat === 'multiple_choice') {
                        const distractors = getDistractors(qObj.correctAnswer, allSetCards, c => c.german);
                        qObj.options = fisherYatesShuffle([qObj.correctAnswer, ...distractors]);
                    }
                    
                    pool.push(qObj);
                });
                return fisherYatesShuffle(pool);
            };

            const startQuiz = async (isTest2 = false, retestCardIds = []) => {
                if (!activeSetId) return;
                const setCardsList = activeCards.filter(c => c.setId === activeSetId);
                if (setCardsList.length === 0) { showToast("This set is empty!"); return; }

                setIsQuizConfigOpen(false);
                let baseQuestions = [];

                if (quizConfig.quizMode === 'fill_blank') {
                    if (!userApiKey) {
                        showToast("API Key required for AI Fill-in-the-Blank!");
                        setIsApiKeyModalOpen(true);
                        return;
                    }
                    setQuizState(prev => ({...prev, isLoadingAI: true, questions: []}));
                    setCurrentView('quiz_play');
                    
                    let cardsToProcess = isTest2 ? setCardsList.filter(c => retestCardIds.includes(c.id)) : setCardsList;
                    try {
                        baseQuestions = await generateFillBlankAI(cardsToProcess, quizConfig.difficulty, quizConfig.answerFormat, activeCards);
                    } catch (e) {
                        showToast(e.message || "Failed to generate AI Questions.");
                        setCurrentView('set');
                        setQuizState(prev => ({...prev, isLoadingAI: false}));
                        return;
                    }
                } else {
                    baseQuestions = buildQuizQuestions(setCardsList, activeCards, quizConfig, isTest2, retestCardIds);
                }

                if (baseQuestions.length === 0) { showToast("Could not generate questions!"); return; }

                setQuizState({ questions: baseQuestions, currentIndex: 0, userAnswers: {}, isSubmitted: false, score: 0, wrongQuestions: [], answeredQuestions: [], isTest2: isTest2, isLoadingAI: false });
                setWrittenInput(''); setCurrentCheckResult(null); setCurrentView('quiz_play');
            };

            const normalizeText = (txt) => {
                if (!txt) return '';
                return txt.toLowerCase().trim().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, "").replace(/\s+/g, " ");
            };

            const handleAnswerSubmit = (answerValue) => {
                if (currentCheckResult) return;
                
                const currentQ = quizState.questions[quizState.currentIndex];
                let finalAnswer = typeof answerValue === 'string' ? answerValue.trim() : answerValue;
                
                if (!finalAnswer) { showToast("Please provide an answer!"); return; }

                const cAns = normalizeText(currentQ.correctAnswer);
                const altAns = normalizeText(currentQ.altCorrectAnswer || '');
                const uAns = normalizeText(finalAnswer);

                const isRight = (uAns === cAns) || (altAns && uAns === altAns);

                setQuizState(prev => {
                    const newAnswers = { ...prev.userAnswers, [currentQ.id]: finalAnswer };
                    const alreadyAnswered = prev.answeredQuestions.some(q => q.id === currentQ.id);
                    const newAnswered = alreadyAnswered ? prev.answeredQuestions : [...prev.answeredQuestions, currentQ];
                    
                    let newScore = prev.score;
                    let newWrong = [...prev.wrongQuestions];
                    if (!alreadyAnswered) {
                        if (isRight) newScore++; 
                        else newWrong.push(currentQ);
                    }

                    return { ...prev, userAnswers: newAnswers, score: newScore, wrongQuestions: newWrong, answeredQuestions: newAnswered };
                });

                setCurrentCheckResult(isRight ? 'correct' : 'wrong');
            };

            const currentSet = activeSets.find(s => s.id === activeSetId);

                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-400 block mb-1">IPA Phonetics</label>
                                        <input type="text" value={cardForm.ipa} onChange={(e) => setCardForm({...cardForm, ipa: e.target.value})} placeholder="e.g. /ˈzʊpə/" className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-400 block mb-1">Part of Speech</label>
                                        <select value={cardForm.partOfSpeech} onChange={(e) => setCardForm({...cardForm, partOfSpeech: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                                            <option value="">None (Noun/Verb/Other)</option>
                                            <option value="adj">adj (Adjective)</option>
                                            <option value="adv">adv (Adverb)</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-400 block mb-1">Plural Form</label>
                                        <input type="text" value={cardForm.plural} onChange={(e) => setCardForm({...cardForm, plural: e.target.value})} placeholder="e.g. die Suppen" className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-400 block mb-1">Translation / Meaning *</label>
                                        <input type="text" value={cardForm.vietnamese} onChange={(e) => setCardForm({...cardForm, vietnamese: e.target.value})} required placeholder="e.g. Canh / Súp, Nhanh" className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500" />
                                    </div>
                                </div>

                                <div>
                                    <label className="text-xs font-semibold text-slate-400 block mb-1">Example Sentence (German)</label>
                                    <input type="text" value={cardForm.example} onChange={(e) => setCardForm({...cardForm, example: e.target.value})} placeholder="e.g. Die Suppe schmeckt sehr gut." className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500" />
                                </div>

                                <div>
                                    <label className="text-xs font-semibold text-slate-400 block mb-1">Example Translation</label>
                                    <input type="text" value={cardForm.exampleTranslation} onChange={(e) => setCardForm({...cardForm, exampleTranslation: e.target.value})} placeholder="e.g. Món súp ăn rất ngon." className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500" />
                                </div>

                                <div className="flex justify-end gap-3 pt-2">
                                    <button type="button" onClick={() => setIsCardModalOpen(false)} className="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white">Cancel</button>
                                    <button type="submit" className="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs">Save Card</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* AI Import Modal */}
                    {isAiImportModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-lg font-bold text-white flex items-center gap-2"><Icons.Sparkles /> Quick Import via AI</h3>
                                    <button onClick={() => setIsAiImportModalOpen(false)} className="text-slate-400 hover:text-white"><Icons.Cross /></button>
                                </div>
                                <p className="text-xs text-slate-400">Paste any text or vocabulary list in German. AI will automatically generate flashcards with exact IPA and adj/adv tags.</p>

                                <textarea value={importRawText} onChange={(e) => setImportRawText(e.target.value)} placeholder="e.g. Suppe, Bier, Tee, schnell, heute..." className="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-sm text-white focus:outline-none focus:border-amber-500 h-32 resize-none"></textarea>

                                <div>
                                    <input type="text" value={customPromptNote} onChange={(e) => setCustomPromptNote(e.target.value)} placeholder="Optional note for AI (e.g. Focus on A1 food words)..." className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-slate-300 focus:outline-none focus:border-amber-500" />
                                </div>

                                <div className="flex justify-end gap-3 pt-2">
                                    <button onClick={() => setIsAiImportModalOpen(false)} className="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white">Cancel</button>
                                    <button onClick={handleAIImport} disabled={isAiImporting} className="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs flex items-center gap-2">
                                        {isAiImporting ? <div className="w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></div> : <Icons.Sparkles />} Generate Cards
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Quiz Config Modal */}
                    {isQuizConfigOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-lg font-bold text-white flex items-center gap-2"><Icons.Quiz /> Exercise Settings</h3>
                                    <button onClick={() => setIsQuizConfigOpen(false)} className="text-slate-400 hover:text-white"><Icons.Cross /></button>
                                </div>

                                <div className="space-y-3">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-400 block mb-1">Exercise Type</label>
                                        <select value={quizConfig.quizMode} onChange={(e) => setQuizConfig({...quizConfig, quizMode: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                                            <option value="mixed">Mixed Types</option>
                                            <option value="spelling">Spelling & Translation</option>
                                            <option value="gender">Noun Gender (der/die/das)</option>
                                            <option value="plural">Noun Plural</option>
                                            <option value="listen_type">Listening Exercise</option>
                                            <option value="fill_blank">Fill-in-the-Blank (AI Context)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="text-xs font-semibold text-slate-400 block mb-1">Answer Format</label>
                                        <select value={quizConfig.answerFormat} onChange={(e) => setQuizConfig({...quizConfig, answerFormat: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                                            <option value="mixed">Mixed (Multiple Choice + Typing)</option>
                                            <option value="multiple_choice">Multiple Choice Only</option>
                                            <option value="written">Written / Typing Only</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="text-xs font-semibold text-slate-400 block mb-1">Difficulty</label>
                                        <select value={quizConfig.difficulty} onChange={(e) => setQuizConfig({...quizConfig, difficulty: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                                            <option value="easy">Easy</option>
                                            <option value="medium">Medium</option>
                                            <option value="hard">Hard</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="flex justify-end gap-3 pt-2">
                                    <button onClick={() => setIsQuizConfigOpen(false)} className="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white">Cancel</button>
                                    <button onClick={() => startQuiz(false)} className="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs flex items-center gap-2">Start Exercise</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
