                                                    <option value="hard">Hard</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Answer Format</label>
                                                <select value={quizConfig.answerFormat} onChange={(e) => setQuizConfig({ ...quizConfig, answerFormat: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-500">
                                                    <option value="mixed">Mixed (Multiple Choice + Written)</option>
                                                    <option value="multiple_choice">Multiple Choice Only</option>
                                                    <option value="written">Written Input Only</option>
                                                </select>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="flex justify-end gap-3 pt-2">
                                    <button onClick={() => setIsQuizConfigOpen(false)} className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm">Cancel</button>
                                    <button onClick={() => startQuiz(false)} className="px-6 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm shadow-lg">Start Exercise</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Folder Modal */}
                    {isFolderModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <form onSubmit={handleSaveFolder} className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                                <h3 className="text-xl font-bold text-white">{editingFolder ? 'Edit Folder' : 'New Folder'}</h3>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Folder Name</label>
                                    <input type="text" value={folderForm.name} onChange={(e) => setFolderForm({ ...folderForm, name: e.target.value })} placeholder="e.g., A2 Intermediate" required className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Description</label>
                                    <textarea value={folderForm.description} onChange={(e) => setFolderForm({ ...folderForm, description: e.target.value })} placeholder="Optional description..." rows="3" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm" />
                                </div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button type="button" onClick={() => setIsFolderModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-sm">Cancel</button>
                                    <button type="submit" className="px-5 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-sm">Save Folder</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Set Modal */}
                    {isSetModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <form onSubmit={handleSaveSet} className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                                <h3 className="text-xl font-bold text-white">{editingSet ? 'Edit Study Set' : 'New Study Set'}</h3>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Set Title</label>
                                    <input type="text" value={setForm.title} onChange={(e) => setSetForm({ ...setForm, title: e.target.value })} placeholder="e.g., Lektion 2: Essen & Trinken" required className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Description</label>
                                    <textarea value={setForm.description} onChange={(e) => setSetForm({ ...setForm, description: e.target.value })} placeholder="Optional description..." rows="3" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm" />
                                </div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button type="button" onClick={() => setIsSetModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-sm">Cancel</button>
                                    <button type="submit" className="px-5 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-sm">Save Set</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Card Modal */}
                    {isCardModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <form onSubmit={handleSaveCard} className="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-bold text-white">{editingCard ? 'Edit Vocabulary Card' : 'New Vocabulary Card'}</h3>
                                <div className="grid grid-cols-3 gap-3">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Article</label>
                                        <select value={cardForm.article} onChange={(e) => setCardForm({ ...cardForm, article: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-500">
                                            <option value="">(None)</option>
                                            <option value="der">der</option>
                                            <option value="die">die</option>
                                            <option value="das">das</option>
                                        </select>
                                    </div>
                                    <div className="col-span-2">
                                        <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">German Word *</label>
                                        <input type="text" value={cardForm.german} onChange={(e) => setCardForm({ ...cardForm, german: e.target.value })} placeholder="e.g., Tisch" required className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm" />
                                    </div>
                                </div>
                                <div className="grid grid-cols-3 gap-3">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">IPA Phonetic</label>
                                        <input type="text" value={cardForm.ipa} onChange={(e) => setCardForm({ ...cardForm, ipa: e.target.value })} placeholder="e.g., /tɪʃ/" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Word Class</label>
                                        <select value={cardForm.partOfSpeech} onChange={(e) => setCardForm({ ...cardForm, partOfSpeech: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-500">
                                            <option value="">Other / Noun</option>
                                            <option value="adj">Adjective (adj)</option>
                                            <option value="adv">Adverb (adv)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Plural Form</label>
                                        <input type="text" value={cardForm.plural} onChange={(e) => setCardForm({ ...cardForm, plural: e.target.value })} placeholder="e.g., die Tische" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">English Meaning *</label>
                                    <input type="text" value={cardForm.vietnamese} onChange={(e) => setCardForm({ ...cardForm, vietnamese: e.target.value })} placeholder="e.g., Table" required className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Example Sentence (German)</label>
                                    <input type="text" value={cardForm.example} onChange={(e) => setCardForm({ ...cardForm, example: e.target.value })} placeholder="e.g., Der Tisch ist neu." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Example Translation (English)</label>
                                    <input type="text" value={cardForm.exampleTranslation} onChange={(e) => setCardForm({ ...cardForm, exampleTranslation: e.target.value })} placeholder="e.g., The table is new." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm" />
                                </div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button type="button" onClick={() => setIsCardModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-sm">Cancel</button>
                                    <button type="submit" className="px-5 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-sm">Save Card</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* AI Import Modal */}
                    {isAiImportModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 md:p-8 space-y-4 shadow-2xl">
                                <h3 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Sparkles /> Quick Import via AI</h3>
                                <p className="text-sm text-slate-400">Paste any German text, story, or vocabulary list below. Gemini will automatically extract and structure the flashcards for you.</p>
                                <textarea value={importRawText} onChange={(e) => setImportRawText(e.target.value)} placeholder="Paste German text here..." rows="6" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm" />
                                <input type="text" value={customPromptNote} onChange={(e) => setCustomPromptNote(e.target.value)} placeholder="Special instructions (optional, e.g., 'Focus on verbs')" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm" />
                                <div className="flex justify-end gap-2 pt-2">
                                    <button onClick={() => setIsAiImportModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-sm">Cancel</button>
                                    <button onClick={handleAIImport} disabled={isAiImporting} className="px-5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm flex items-center gap-2">
                                        {isAiImporting ? <span className="w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span> : <Icons.Sparkles />}
                                        {isAiImporting ? 'Extracting...' : 'Import Cards'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* API Key Modal */}
                    {isApiKeyModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                                <h3 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Key /> Gemini API Key Settings</h3>
                                <p className="text-sm text-slate-400">Enter your Google Gemini API key to enable AI features, sentence dictation generation, and smart flashcard imports.</p>
                                <input type="password" id="apiKeyInput" defaultValue={userApiKey} placeholder="AIzaSy..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-amber-500 text-sm font-mono" />
                                <div className="flex justify-end gap-2 pt-2">
                                    <button onClick={() => setIsApiKeyModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-sm">Cancel</button>
                                    <button onClick={() => saveApiKey(document.getElementById('apiKeyInput').value)} className="px-5 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-sm">Save Key</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Confirm Dialog */}
                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-center">
                                <div className="w-12 h-12 bg-rose-500/20 text-rose-400 rounded-full flex items-center justify-center mx-auto"><Icons.Trash /></div>
                                <h4 className="font-bold text-white text-lg">Confirm Action</h4>
                                <p className="text-sm text-slate-400">{confirmDialog.message}</p>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setConfirmDialog({ isOpen: false, message: '', onConfirm: null })} className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-xl text-sm">Cancel</button>
                                    <button onClick={confirmDialog.onConfirm} className="flex-1 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-sm">Confirm</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
